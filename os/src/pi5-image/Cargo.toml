# The bootable Raspberry Pi 5 image (`STORY-P1-07-05`).
#
# Packaging only: every behaviour in the image — entry report, EL2→EL1 drop,
# READY sequence, vector install, UART verdict — lives in `hal-arm64`, where
# it is host-tested behind the MMIO seam. This crate exists because a flat
# `kernel8.img` needs an AArch64 *binary* to flatten, and `STORY-P1-07-01`
# deliberately left producing one to the run-path Story.

[package]
name = "pi5-image"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bootable Raspberry Pi 5 image, flattened to kernel8.img by `xtask pi5` (STORY-P1-07-05)"

[features]
# Forwarded to `hal-arm64`: the deliberate-translation-fault boot
# (`TEST-P1-07-03-A` clause 6). Selected by `xtask pi5 --fixture=mmu-fault`.
fixture-mmu-fault = ["hal-arm64/fixture-mmu-fault"]
# `STORY-P1-07-06`: link `kernel::fixture_measure_arm64` and let the boot
# call it — the first hardware measurement. Selected by
# `xtask pi5 --fixture=measure`.
fixture-measure = ["hal-arm64/fixture-measure", "kernel/fixture-measure"]

[dependencies]
hal-arm64 = { path = "../hal-arm64" }
# Linked for `fixture_measure_arm64`'s `#[no_mangle]` entry when the
# `fixture-measure` feature selects it; otherwise contributes nothing to the
# image (the kernel lib's arch-neutral core is dead-stripped).
kernel = { path = "../kernel" }
