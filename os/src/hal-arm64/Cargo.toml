[package]
name = "hal-arm64"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "AArch64 HAL backend: boot path, PL011, vectors, flat identity MMU (STORY-P1-07-03), RP1 Ethernet, canvas — bounded by FEAT-P1-07 §6, not a full HAL port."

[features]
# TEST-P1-07-03-A clause 6: the boot deliberately loads from an address the
# identity map excludes, so the translation fault reports through the
# STORY-P1-07-02 handler with a decoded ESR and a matching FAR. A fixture,
# never a default.
fixture-mmu-fault = []
# STORY-P1-07-06: the boot calls the measurement fixture the image linked
# (`tinyos_arm64_fixture_measure`), the fault path honours the fixture's
# escape hook, and the park loop carries the recorded envelope on the canvas
# and the wire. A fixture, never a default.
fixture-measure = []
# ADR 0005 Q3's arms (12A §0): forwarded so `boot` can name the fixture in
# its TOS64-RESULT/1 line; the arm code itself lives in
# `kernel::fixture_measure_arm64` behind the kernel's twin features.
fixture-qual-control = ["fixture-measure"]
fixture-qual-campaign = ["fixture-measure"]

[dependencies]
hal = { path = "../hal" }

[dev-dependencies]
# Host-only, and only for `TEST-P1-01-03-A` clause 5: the whole point of this
# crate is that `kernel::measure` consumes it unmodified, which can only be
# demonstrated by actually driving the harness with it.
kernel = { path = "../kernel" }
