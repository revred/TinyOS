[package]
name = "kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TinyOS kernel: scheduler, IPC, memory pools, deadline monitor. Phase 0: boot-to-halt walking skeleton only."

[dependencies]
hal = { path = "../hal" }

# The x86_64 backend is a dependency of the x86_64 build only
# (`STORY-P1-07-06`): the AArch64 boot image links this crate's lib for the
# shared harness, pools, scheduler and context switch, and an unconditional
# `hal-x86_64` here was the one line that made the measurement seam
# x86-shaped in practice while every trait claimed otherwise.
[target.'cfg(target_arch = "x86_64")'.dependencies]
hal-x86_64 = { path = "../hal-x86_64" }

# The AArch64 backend, for `fixture_measure_arm64` (`STORY-P1-07-06`) — the
# same relationship this crate has always had with `hal-x86_64`, on the
# second architecture. (`hal-arm64`'s dev-dependency on this crate is
# host-side only; Cargo permits the cycle because dev-dependencies do not
# participate in the dependency graph of the library build.)
[target.'cfg(target_arch = "aarch64")'.dependencies]
hal-arm64 = { path = "../hal-arm64" }

[lib]
name = "kernel"
path = "src/lib.rs"

[features]
# Forces a panic immediately after entering `kernel_main`, before the normal
# success exit — used only by `xtask qemu-x86_64 --fixture broken-boot` and
# `TEST-P0-01-03-A` to prove the failure path is distinguishable from success,
# never enabled in a real boot image.
fixture-broken-boot = []
# Replaces the normal ACPI-topology-discovery boot path with the
# STORY-P0-02-02 context-switch fixture — used only by
# `xtask qemu-x86_64 --fixture=context-switch` and `TEST-P0-02-02-A`, never
# enabled in a real boot image.
fixture-context-switch = []
# Brings up the IDT/local-APIC timer and measures the bounded interval
# between real ticks — used only by
# `xtask qemu-x86_64 --fixture=idt-apic-timer` and `TEST-P0-04-02-A`, never
# enabled in a real boot image.
fixture-idt-apic-timer = []
# Brings up the same IDT and deliberately triggers a vector this kernel
# never routes, proving the fail-closed default handler is actually reached
# — used only by `xtask qemu-x86_64 --fixture=idt-apic-unrouted` and
# `TEST-P0-04-02-A`. This fixture's *correct* result is a QEMU
# isa-debug-exit **Failure** code, mirroring `fixture-broken-boot`'s own
# established precedent (see `main.rs`'s doc comment on this feature).
fixture-idt-apic-unrouted = []
# Replaces the normal boot path with a read-only PCI bus-0 enumeration walk
# judged against QEMU q35's known device exposure — used only by
# `xtask qemu-x86_64 --fixture=pci-enumeration` and `TEST-P0-04-03-A`, never
# enabled in a real boot image.
fixture-pci-enumeration = []
# Drives `kernel::mem::Pool` through the same operation shapes the
# `STORY-P0-03-01`/`PERF-D07` host diagnostic harness (`mem.rs`'s
# `#[cfg(test)]` module) measures, compiled for the real `x86_64-tinyos`
# target and run under QEMU, reporting cycle-count evidence over the COM1
# UART (`hal_x86_64::serial`) — used only by
# `xtask qemu-x86_64 --fixture=pool-bench`, never enabled in a real boot
# image.
fixture-pool-bench = []
# Drives the performance domains `FEAT-P1-01`/`FEAT-P1-02` name as measured
# targets (context switch D04, ready-queue dispatch D05, pool allocation D07,
# and — since `LE-17` — fault capture/disposition latency D02) through
# `kernel::measure`, reporting the versioned `TOS64-MEAS/2` envelope over
# COM1 — used only by `xtask measure` / `xtask qemu-x86_64 --fixture=measure`
# and `TEST-P1-01-01-A`, never enabled in a real boot image. Installs its own
# fault-only IDT and `tinyos_fault_entry` (replacing `main.rs`'s default) so
# the D02 phase's deliberate `#UD` is timed and survived rather than halting.
fixture-measure = []
# Raises a real #UD, #GP and #PF from inside scheduled tasks and proves each
# terminates that task only, with the scheduler still dispatching work
# afterwards (`TEST-P1-02-01-A`) — used only by
# `xtask qemu-x86_64 --fixture=fault`, never enabled in a real boot image.
fixture-fault = []
# Destroys a task's stack so the resulting #PF cannot have its own frame pushed
# either, escalating to a real #DF, and proves the IST-backed handler runs on
# the known-good stack and reports instead of triple-faulting
# (`TEST-P1-02-02-A`) — used only by
# `xtask qemu-x86_64 --fixture=double-fault`, never enabled in a real boot
# image.
fixture-double-fault = []
# `STORY-P1-04-01`/`TEST-P1-04-01-A` clauses 4-5: a busy-looping task with no
# yield of any kind is preempted by the local-APIC timer in favour of a task
# made Ready from interrupt context, and the SSE state it was using survives
# a preemption in which the preempting task deliberately clobbers `XMM0`
# (`LE-14`) — used only by `xtask qemu-x86_64 --fixture=preempt`, never
# enabled in a real boot image.
fixture-preempt = []
# `TEST-P1-04-01-A` clause 6: the classic three-task priority-inversion
# scenario under genuine preemption, closing `STORY-P0-02-03`'s host-only
# caveat — used only by
# `xtask qemu-x86_64 --fixture=priority-inversion`, never enabled in a real
# boot image.
fixture-priority-inversion = []
# `STORY-P1-04-02`/`TEST-P1-04-02-A` clauses 4-7: a task that exceeds its
# declared WCET budget under the real local-APIC timer has the consequence it
# declared at creation applied to it. One fixture per policy arm, all three
# sharing `fixture_wcet.rs` so the arms cannot drift apart — only one of these
# three is ever enabled at a time. Never enabled in a real boot image.
fixture-wcet-restart = []
fixture-wcet-degrade = []
# This fixture's *correct* result is a QEMU isa-debug-exit **Failure** code:
# its whole claim is that the system stops. Same precedent as
# `fixture-broken-boot` and `fixture-idt-apic-unrouted`.
fixture-wcet-trip = []
# `STORY-P1-04-05`/`TEST-P1-04-05-A`, closing `LE-50`: the *composed*
# scenario — a lock holder that overruns its budget while boosted by a blocked
# waiter — run under genuine timer-driven preemption. `STORY-P1-04-04` proved
# the composition at the host level; this proves it by who the dispatcher
# actually selects. A second fixture rather than an extension of
# `fixture-priority-inversion`, whose run is evidence a Verified Story rests
# on. Used only by `xtask qemu-x86_64 --fixture=degrade-inheritance`, never
# enabled in a real boot image.
fixture-degrade-inheritance = []
# `STORY-P1-06-01`/`TEST-P1-06-01-A`: `G-PA-1`'s decision-to-actuation path.
# One RT task arms an activation, computes a command and emits it through
# `hal::actuation::OutputLine` (under Tier 0 a real ISA port write), with the
# latency measured through `kernel::measure` and reported as a `TOS64-MEAS/2`
# envelope. Two fixtures, one source file, one constant apart — the declared
# WCET budget — so the two arms cannot drift. Never enabled in a real boot
# image.
fixture-actuation = []
# The same path with a decision that deliberately overruns its declared budget.
# Its *correct* result is a QEMU isa-debug-exit **Failure** code: the system
# enters its declared safe state and no command reaches the line. Same
# precedent as `fixture-broken-boot`, `fixture-idt-apic-unrouted` and
# `fixture-wcet-trip`.
fixture-actuation-overrun = []
# The same measurement fixture with one measured phase deliberately made ~8x
# slower, so `xtask check-timing-regression --inject-regression` can prove the
# gate actually fails — `STORY-P1-01-02`'s "prove it can fail" criterion, and
# the same discipline `fixture-broken-boot` established for the boot path.
# Never enabled in a real image, and never by CI's own gate step.
fixture-measure-regression = ["fixture-measure"]
# ADR 0005 Q3's two arms (12A §0) — measurement instrumentation riding the
# measure fixture, never a real boot image. `qual-control` injects one benign
# PSCI_VERSION SMC mid-window and must SEE the EL3 round-trip (the trap
# clause); `qual-campaign` runs 6,000 windows and puts the distribution of
# unaccounted physical ticks on the wire. Both imply `fixture-measure` the way
# `fixture-measure-regression` does: they are that fixture with one more arm.
fixture-qual-control = ["fixture-measure"]
fixture-qual-campaign = ["fixture-measure"]

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false
