[package]
name = "exec"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "PE64 executable loading and process compatibility (FEAT-P0-05). Phase 0: PE64 image parsing (STORY-P0-05-01) and process address-space creation/section mapping (STORY-P0-05-02)."

[dependencies]
kernel = { path = "../kernel" }
hal-x86_64 = { path = "../hal-x86_64" }
# `first-task-fixture` reproduces the real boot path's PCI enumeration,
# which builds a `hal::device::DeviceTable` (`STORY-P1-03-02`).
hal = { path = "../hal" }

[[bin]]
# `TEST-P0-05-02-A`'s Tier 0 QEMU fixture. A separate `no_std`/`no_main`
# binary (not a `kernel` fixture feature, unlike `context-switch`) because
# `exec` depends on `kernel`'s library for `kernel::mem::Pool` — `kernel`'s
# own binary depending back on `exec` would be a cyclic crate dependency.
# See `hal_x86_64::boot`'s doc comment for the shared boot-entry glue this
# binary reuses.
name = "exec-fixture"
path = "src/fixture_main.rs"
test = false
bench = false

[[bin]]
# `TEST-P0-05-03-A`'s Tier 0 QEMU fixture, following `exec-fixture`'s own
# precedent above.
name = "win32-shim-fixture"
path = "src/fixture_win32_shim_main.rs"
test = false
bench = false

[[bin]]
# `TEST-P0-05-04-A`'s Tier 0 QEMU fixture: the real `blue-sharc.exe`
# artifact (repacked via `xtask pack-txe`, `STORY-P0-08-01`), following
# `exec-fixture`'s own precedent above.
name = "blue-sharc-fixture"
path = "src/fixture_blue_sharc_main.rs"
test = false
bench = false

[[bin]]
# `TEST-P0-05-04-A` acceptance criterion 3's deliberately-corrupted-copy
# fixture, mirroring `kernel`'s own `fixture-broken-boot` pattern.
name = "blue-sharc-broken-fixture"
path = "src/fixture_blue_sharc_broken_main.rs"
test = false
bench = false

[[bin]]
# `TEST-P0-07-02-A`'s Tier 0 QEMU fixture, following `exec-fixture`'s own
# precedent above.
name = "shared-memory-fixture"
path = "src/fixture_shared_memory_main.rs"
test = false
bench = false

[[bin]]
# `STORY-P1-03-01`'s Tier 0 QEMU fixture: two tasks, each with its own real
# `AddressSpace`/`CR3`, switched between via `kernel::context::switch_address_space`.
name = "address-space-switch-fixture"
path = "src/fixture_address_space_switch_main.rs"
test = false
bench = false

[[bin]]
# `TEST-P1-03-02-A` clauses A1-A4: W^X in both directions with the
# enforcement bits on, shared kernel page directories, loader-alias
# sealing, and generation-safe teardown proven by a stale-mapping probe.
name = "wx-seal-fixture"
path = "src/fixture_wx_seal_main.rs"
test = false
bench = false

[[bin]]
# `TEST-P1-03-02-A` clauses I1-I5: the first real task — the reproduced
# real boot path scheduling `blue-sharc.exe` in its own W^X address space
# through the CR3-aware dispatcher, contained and audited.
name = "first-task-fixture"
path = "src/fixture_first_task_main.rs"
test = false
bench = false

[[bin]]
# `STORY-P0-01-06`: the D09 PE64 parse/import-validation measurement, against
# the same real `blue-sharc.txe` artifact `blue-sharc-fixture` loads. Outside
# the gated `measure` envelope on purpose — see the fixture's own doc comment
# and `TEST-P0-01-06-A` clause 3.
name = "pe-measure-fixture"
path = "src/fixture_pe_measure_main.rs"
test = false
bench = false

[[bin]]
# `STORY-P1-03-03`: the D04 same-space vs cross-space dispatch measurement
# `FEAT-P1-03`'s exit criteria have asked for since `STORY-P1-03-01`.
# Reports through the same TOS64-MEAS/2 envelope `xtask measure` parses.
name = "dispatch-measure-fixture"
path = "src/fixture_dispatch_measure_main.rs"
test = false
bench = false
