[package]
name = "os"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The TinyOS system image (STORY-P1-03-03): the real boot path that discovers hardware, installs W^X address spaces, and schedules a real loaded task under capability mediation."

[dependencies]
kernel = { path = "../kernel" }
exec = { path = "../exec" }
hal = { path = "../hal" }
hal-x86_64 = { path = "../hal-x86_64" }

[[bin]]
# The shipping image. Unlike `kernel`'s own binary this one may depend on
# `exec`, which is the whole reason it exists: `exec` depends on `kernel`,
# so `kernel` can never depend back on `exec` without a cyclic crate
# dependency, and every integration so far has had to live in a fixture
# binary because of it (see this crate's `main.rs` module doc).
name = "os"
path = "src/main.rs"
test = false
bench = false
