<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>tab identity satellite</title>
<style>:root { color-scheme: dark; } body { margin: 0; background: #0C0C0C; }</style>
</head>
<body>
<!-- V1.1 (06A / work/UX-V1 Part F): the per-tab identity satellite.
     The V1 chrome renders every pixel in index.html; THIS webview exists because the
     signed manifest's grant tables are disjoint — only an enumerated tab label may
     invoke run_line / read_tab / run_parity, and the session identity is this
     webview's runtime label, never an argument. The chrome asks for work over the
     same-origin UI bus (a rendering-layer channel: no capability crosses it — every
     invoke below still resolves under THIS identity at the authority seam), and this
     page relays the host's answers back for the chrome to paint. -->
<script>
(function () {
  "use strict";
  var invoke = window.__TAURI__ && window.__TAURI__.core.invoke;
  if (!invoke) return;

  // UI bus: BroadcastChannel primary, localStorage storage-events as belt-and-braces.
  // Receivers dedupe on message id, so hearing both copies is harmless.
  var seen = {};
  function makeBus(onMsg) {
    function accept(m) {
      if (!m || !m.id || seen[m.id]) return;
      seen[m.id] = 1;
      onMsg(m);
    }
    var bc = null;
    try {
      bc = new BroadcastChannel("ti64-ui");
      bc.onmessage = function (e) { accept(e.data); };
    } catch (e) { /* storage path below still works */ }
    window.addEventListener("storage", function (e) {
      if (e.key === "ti64-ui" && e.newValue) {
        try { accept(JSON.parse(e.newValue)); } catch (x) { /* not ours */ }
      }
    });
    var n = 0;
    return {
      post: function (m) {
        m.id = "s" + Math.random().toString(36).slice(2) + (++n);
        if (bc) bc.postMessage(m);
        try { localStorage.setItem("ti64-ui", JSON.stringify(m)); } catch (e) { /* bc carried it */ }
      }
    };
  }

  var label = null;

  // One line at a time, in arrival order: run_line, then a fresh snapshot, then the
  // next line — so a queued boot sequence lands in the transcript in sequence.
  var queue = [], busy = false;
  function pump() {
    if (busy || !queue.length) return;
    busy = true;
    var job = queue.shift();
    var call = job.kind === "parity"
      ? invoke("run_parity")
      : invoke("run_line", { line: job.line });
    call
      .catch(function (e) {
        bus.post({ type: "tab-error", label: label, line: job.line || "", error: String(e) });
      })
      .then(function () { return snap().catch(function () {}); })
      .then(function () { busy = false; pump(); });
  }

  function snap() {
    return invoke("read_tab").then(function (s) {
      if (!label) {
        label = s.info.label;
        bus.post({ type: "hello", label: label });
      }
      bus.post({
        type: "tab", label: label, info: s.info,
        transcript: s.transcript, suite: s.suite || null
      });
    });
  }

  var bus = makeBus(function (m) {
    if (!label) return;
    if (m.type === "run" && m.label === label) { queue.push({ kind: "run", line: m.line }); pump(); }
    if (m.type === "parity" && m.label === label) { queue.push({ kind: "parity" }); pump(); }
  });

  setInterval(function () { snap().catch(function () { /* slot may not exist yet */ }); }, 250);
  snap().catch(function () {});

  // Smoke hooks — the unattended run may still drive a line through this tab's own
  // identity directly (the keyboard path in the chrome is the primary drive).
  window.smokeRunLine = function (line) { queue.push({ kind: "run", line: line }); pump(); };
  window.smokeRunParity = function () { queue.push({ kind: "parity" }); pump(); };
})();
</script>
</body>
</html>
