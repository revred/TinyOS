<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ti-OS console v3 — three layouts, one build</title>
<link rel="stylesheet" href="console.css">
<style>
  /* Fixed by preference, not by layout:
     · the system line is the LAST line of the window, under the prompt, unlabelled;
     · the top-left corner names the RUNNING WORKLOAD and switches it; the rail below shows
       that workload's tools, compressed to icons or expanded with detail on click;
     · tabs carry a flavour and are switchable three ways;
     · the meter dock stays visible while you type.
     The layouts below differ only in how much of the machine you see at once. */
  body { display: flex; flex-direction: column; }
  /* Row 1: the top-left corner selects the workbench; the tab strip owns the rest.
     Row 2: workbench panel | grip | session. Both rows share one column ruler. */
  #topbar { display: grid; grid-template-columns: var(--side-w, 232px) 4px 1fr; flex: none;
    background: var(--s-2); }
  body[data-side="0"] #topbar { grid-template-columns: 46px 0 1fr; }
  #body { flex: 1; min-height: 0; display: grid; overflow: hidden;
    grid-template-columns: var(--side-w, 232px) 4px 1fr;
    grid-template-rows: minmax(0, 1fr); }
  body[data-side="0"] #body { grid-template-columns: 46px 0 1fr; }
  #side { grid-column: 1; } #grip { grid-column: 2; } #main { grid-column: 3; }

  /* the corner — reserved for choosing the workbench; the panel below it follows */
  #corner { display: flex; align-items: center; gap: 8px; width: 100%; height: 34px;
    padding: 0 12px; background: var(--s-3); border: 0; border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line); color: var(--c-bwhite); font: inherit;
    cursor: pointer; text-align: left; }
  /* one icon axis, both widths: every glyph in the left column is centred in a 24 px cell
     that starts 12 px in (expanded) or centred in the 46 px stub (compressed) */
  #corner .g { width: 24px; display: flex; justify-content: center; flex: none; }
  body[data-side="0"] #corner { justify-content: center; padding: 0; }
  #corner:hover, #corner[aria-expanded="true"] { background: var(--line-hot); color: #fff; }
  #corner .g { font-size: 15px; color: var(--c-bcyan); flex: none; display: flex; }
  #corner .kb { width: 17px; height: 17px; }
  #corner:hover .g, #corner[aria-expanded="true"] .g { color: #fff; }
  #corner .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 12px; letter-spacing: .08em; }
  #corner .cv { margin-left: auto; color: var(--t-meta); font-size: 10px; }
  #corner:hover .cv, #corner[aria-expanded="true"] .cv { color: #fff; }
  body[data-side="0"] #corner .nm, body[data-side="0"] #corner .cv { display: none; }
  #benchlist { position: absolute; top: 34px; left: 0; width: 274px; display: none;
    background: var(--s-1); border: 1px solid var(--line-hot); z-index: 25;
    box-shadow: 0 14px 40px rgba(0,0,0,.6); }
  #benchlist[data-open="1"] { display: block; }
  #benchlist button { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; width: 100%;
    padding: 8px 10px; background: none; border: 0; color: var(--c-fg); font: inherit;
    text-align: left; cursor: pointer; }
  #benchlist button .g { color: var(--c-bcyan); }
  #benchlist button .kb { width: 17px; height: 17px; vertical-align: -3px; }
  #benchlist button .n { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; }
  #benchlist button .sub { display: block; font-size: 11px; color: var(--t-meta); }
  #benchlist button:hover, #benchlist button[aria-selected="true"] { background: var(--s-3); }

  #side { background: var(--s-1); border-right: 1px solid var(--line); overflow: hidden;
    display: flex; flex-direction: column; width: 100%; }
  /* compressed rail: icons only, detail on demand — the corner already names the bench,
     so the panel carries no title of its own */
  body[data-side="0"] #side { background: var(--s-2); }
  body[data-side="0"] #side .wb { grid-template-columns: 1fr; justify-items: center;
    padding: 10px 0; border-left: 2px solid transparent; box-sizing: border-box; }
  body[data-side="0"] #side .wb .ic { margin-left: -2px; }
  body[data-side="0"] #side .wb:hover { background: var(--s-3); }
  body[data-side="0"] #side .wb[aria-current="true"] { border-left-color: var(--line-hot);
    background: var(--s-3); }
  body[data-side="0"] #side .wb > span:not(.ic) { display: none; }
  body[data-side="0"] #side .wb .ic { grid-row: 1; font-size: 19px; }
  body[data-side="0"] #sidetogglet { display: none; }
  .wb.back { background: var(--s-2); border-bottom: 1px solid var(--line); }
  .wb.back .ic, .wb.back > span:nth-child(2) { color: var(--c-bwhite); }
  #sideitems .detail2 { padding: 8px 12px 10px 46px; background: var(--s-0);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  #sideitems .detail2 p { margin: 0 0 8px; font-size: 12px; color: var(--t-meta); line-height: 1.5; }
  #sideitems .detail2 .ev { font-size: 11px; margin-bottom: 8px; }
  #sideitems .detail2 .chip { font-size: 11px; padding: 4px 8px; }
  body[data-side="0"] #sideitems .detail2 { display: none; }
  .wb[aria-current="true"] { background: var(--s-3); }
  /* the rail toggle lives on the metering row, aligned to the rail's column */
  #dockrow { display: flex; align-items: stretch; flex: none; border-top: 1px solid var(--line); }
  #dockrow .dock { flex: 1; min-width: 0; border-top: 0; }
  #sidetoggle { display: flex; align-items: center; justify-content: center;
    gap: 6px; width: var(--side-w, 232px); background: var(--s-2); border: 0;
    border-right: 1px solid var(--line); color: var(--t-meta); font: 11px/1 var(--font);
    cursor: pointer; flex: none; }
  body[data-side="0"] #sidetoggle { width: 46px; }
  #sidetoggle:hover { color: var(--c-bwhite); background: var(--s-3); }
  #sidetogglei { font-size: 14px; }
  #sideitems { overflow-y: auto; flex: 1; min-height: 0; }
  #grip { cursor: col-resize; background: transparent; }
  #grip:hover, #grip:focus-visible { background: var(--line-hot); }
  body[data-side="0"] #grip { pointer-events: none; }

  /* --- the three layouts --------------------------------------------------- */
  #main { min-width: 0; min-height: 0; display: grid; gap: 1px; background: var(--line);
    grid-template-rows: minmax(0, 1fr); }
  body[data-layout="focus"]   #main { grid-template-columns: 1fr; }
  body[data-layout="cockpit"] #main { grid-template-columns: 1fr var(--ctx-w, 330px); }
  body[data-layout="split"]   #main { grid-template-columns: 1fr 1fr; }
  #main > .cell { background: var(--s-0); min-width: 0; min-height: 0; display: flex;
    flex-direction: column; overflow: hidden; }
  .cell > header { display: flex; align-items: center; gap: 8px; padding: 4px 10px;
    background: var(--s-1); border-bottom: 1px solid var(--line); font-size: 11px;
    letter-spacing: .08em; text-transform: uppercase; color: var(--t-meta); flex: none; }
  .cell[data-live="1"] > header { color: var(--c-bwhite); }
  .cell > header .badge2 { margin-left: auto; color: var(--t-meta); font-size: 10px; }
  .cell > .scrollpane { overflow-y: auto; flex: 1; min-height: 0; }
  .pad { padding: 10px 12px; }

  /* shared body pieces */
  .dro { display: grid; grid-template-columns: 22px 1fr 1fr auto; gap: 2px 10px; align-items: baseline; }
  .dro .h { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--t-meta); }
  .dro .ax { color: var(--c-bcyan); font-size: 16px; }
  .dro .num { font-size: 20px; color: var(--c-bwhite); text-align: right; font-variant-numeric: tabular-nums; }
  .dro .num.w { color: var(--c-bgreen); }
  .dro .jog { display: flex; gap: 3px; }
  .dro .jog button { width: 26px; height: 26px; background: var(--s-2); border: 1px solid var(--line);
    color: var(--c-fg); font: inherit; cursor: pointer; }
  .modes { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 10px; }
  .modes button { padding: 5px 10px; background: var(--s-2); border: 1px solid var(--line);
    color: var(--t-meta); font: inherit; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--c-green); border-color: var(--c-bgreen);
    color: #04140A; font-weight: 700; }
  .ovr { display: grid; grid-template-columns: 76px 1fr 48px; gap: 6px 10px; align-items: center;
    font-size: 12px; }
  .ovr input[type=range] { width: 100%; accent-color: var(--c-bgreen); }
  .kv { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 4px 10px; font-size: 12px; }
  .kv .k { color: var(--t-meta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  h4 { margin: 12px 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--t-head); font-weight: 400; }
  h4:first-child { margin-top: 0; }
  .caveat { font-size: 11px; color: var(--t-absent); margin: 6px 0 0; line-height: 1.5; }
  .estop { display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin-top: 8px;
    border: 1px solid var(--c-red); background: #20080A; }
  .estop b { color: var(--c-bred); flex: none; }
  .prop { border: 1px solid var(--line); background: var(--s-1); padding: 8px 10px; margin-bottom: 8px; }
  .prop .cap { color: var(--c-bcyan); }
  .prop .why { color: var(--t-meta); font-size: 12px; margin: 3px 0 6px; }
  .prop .acts { display: flex; gap: 6px; align-items: center; }
  .prop .tok { margin-left: auto; font-size: 11px; color: var(--t-meta); }
  .prop[data-state="approved"] { border-color: var(--c-green); }
  .prop[data-state="denied"] { border-color: var(--c-red); opacity: .75; }
  .risk { font-size: 10px; padding: 1px 6px; border: 1px solid var(--line); color: var(--t-meta); }
  .risk[data-r="actuates"] { color: var(--t-warn); border-color: var(--c-yellow); }
  .risk[data-r="destructive"] { color: var(--t-deny); border-color: var(--c-red); }
  .bar { height: 6px; background: var(--s-3); margin-top: 4px; }
  .bar > i { display: block; height: 100%; background: var(--c-bgreen); }

  .tabs { overflow-x: auto; overflow-y: hidden; scrollbar-width: thin; }
  .tabs .grow { flex: none; }
  #layoutpick { display: flex; gap: 2px; margin-left: 10px; flex: none; }
  #layoutpick button { background: rgba(0,0,0,.35); border: 1px solid #6B5300; color: var(--c-byellow);
    font: 11px/1 var(--font); padding: 5px 8px; cursor: pointer; opacity: .75; }
  #layoutpick button:hover { opacity: 1; }
  #layoutpick button[aria-pressed="true"] { background: var(--c-yellow); color: #1A1400;
    border-color: var(--c-yellow); opacity: 1; font-weight: 700; }
  .tab .ic { font-size: 14px; color: var(--c-bcyan); }
  .tab[aria-selected="true"] .ic { color: var(--c-bwhite); }
  .tab .ord { font-variant-numeric: tabular-nums; }

  /* GUI flavour — 1e's desktop, keeping the meter dock and the system line */
  #gui { grid-column: 3; display: none; overflow-y: auto; min-height: 0;
    background: radial-gradient(120% 100% at 50% 0%, #14181F 0%, #0C0C0C 70%); }
  body[data-gui="1"] #gui { display: block; }
  body[data-gui="1"] #main { display: none; }
  #shellwrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #tiles { display: grid; gap: 12px; padding: 22px;
    grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); align-content: start; }
  .tile { display: flex; flex-direction: column; gap: 5px; align-items: flex-start; min-height: 104px;
    padding: 12px 14px; background: var(--s-2); border: 1px solid var(--line); color: var(--c-fg);
    font: inherit; text-align: left; cursor: pointer; border-radius: 4px; }
  .tile:hover { border-color: var(--line-hot); background: var(--s-3); }
  .tile .glyph { font-size: 19px; color: var(--c-bcyan); }
  .tile .t { color: var(--c-bwhite); font-size: 13px; }
  .tile .v { font-size: 11px; color: var(--t-meta); margin-top: auto; }
  .tile[data-state="absent"] { opacity: .55; }
  .tile[data-state="pending"] .v { color: var(--t-pending); }
  .tile[data-state="live"] .v { color: var(--t-pass); }
  .sheet li .k2 { color: var(--c-bgreen); width: 132px; flex: none; }

  /* --- master menu (Start-button lineage) --------------------------------- */
  #start svg { width: 15px; height: 19px; flex: none; }
  #start { display: flex; align-items: center; justify-content: center; gap: 8px; height: 24px;
    align-self: center; min-width: 92px; padding: 0 14px; margin: 0 6px 0 2px;
    background: linear-gradient(180deg, #4A3A00, #2E2400);
    border: 1px solid var(--c-yellow); border-radius: 3px;
    box-shadow: 0 1px 0 rgba(249,241,165,.25) inset, 0 1px 3px rgba(0,0,0,.5);
    color: var(--c-byellow); font: 600 13px/1 var(--font); cursor: pointer; flex: none; }
  #start:hover { background: linear-gradient(180deg, #6B5300, #3D2E00); }
  #start:active, #start[aria-expanded="true"] { background: var(--c-yellow); color: #1A1400;
    box-shadow: 0 1px 2px rgba(0,0,0,.4) inset; }
  #start .logo { font-size: 15px; }
  #menu { position: absolute; left: 0; bottom: 28px; width: 620px; max-width: 96vw;
    display: none; grid-template-columns: 34px 208px 1fr; background: var(--s-1);
    border: 1px solid var(--c-yellow); box-shadow: 0 -14px 44px rgba(0,0,0,.72); z-index: 20; }
  #menu[data-open="1"] { display: grid; }
  #menu .banner { background: linear-gradient(0deg, #2E2400, #6B5300); color: var(--c-byellow);
    writing-mode: vertical-rl; transform: rotate(180deg); text-align: right;
    font: 700 15px/34px var(--font); letter-spacing: .18em; padding: 12px 0; }
  #menu .cats { border-right: 1px solid var(--line); padding: 6px 0; display: flex;
    flex-direction: column; }
  #menu .cats button { display: grid; grid-template-columns: 24px 1fr 12px; align-items: center;
    gap: 8px; padding: 8px 10px; background: none; border: 0; color: var(--c-fg); font: inherit;
    text-align: left; cursor: pointer; }
  #menu .cats button .g { font-size: 16px; color: var(--c-bcyan); }
  #menu .cats button .arw { color: var(--t-meta); }
  #menu .cats button[aria-selected="true"] { background: var(--line-hot); color: #fff; }
  #menu .cats button[aria-selected="true"] .g,
  #menu .cats button[aria-selected="true"] .arw { color: #fff; }
  #menu .items { padding: 6px 0; max-height: 372px; overflow-y: auto; }
  #menu .items button { display: grid; grid-template-columns: 22px 1fr; gap: 8px; width: 100%;
    padding: 7px 12px; background: none; border: 0; color: var(--c-fg); font: inherit;
    text-align: left; cursor: pointer; }
  #menu .items button .g { color: var(--c-bcyan); }
  #menu .items button .d { display: block; font-size: 11px; color: var(--t-meta); }
  #menu .items button:hover, #menu .items button[aria-selected="true"] { background: var(--s-3); }
  #menu .items button[data-state="absent"] { color: var(--t-absent); }
  #menu .items button[data-state="absent"] .g { color: var(--t-absent); }
  #menu .find { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px;
    border-top: 1px solid var(--line); padding: 6px 10px; }
  #menu .find input { flex: 1; background: var(--s-0); border: 1px solid var(--line);
    color: var(--c-bwhite); font: inherit; padding: 5px 8px; outline: none; }
  #menu .find input:focus { border-color: var(--line-hot); }
  #menu .find .hint { color: var(--t-meta); font-size: 11px; white-space: nowrap; }
</style>
</head>
<body data-side="1" data-gui="0" data-layout="cockpit">

<div id="topbar">
  <div style="position:relative">
    <button id="corner" aria-haspopup="menu" aria-expanded="false" aria-controls="benchlist"
            title="Running workload — click to switch (Ctrl+Shift+W)">
      <span class="g" id="cornerglyph"><svg viewBox="0 0 24 24" aria-hidden="true" class="kb">
        <rect x="1.5" y="8" width="3" height="8" rx="1" fill="currentColor"/>
        <rect x="5" y="6" width="3.4" height="12" rx="1.2" fill="currentColor"/>
        <rect x="8.4" y="10.6" width="7.2" height="2.8" fill="currentColor"/>
        <rect x="15.6" y="6" width="3.4" height="12" rx="1.2" fill="currentColor"/>
        <rect x="19.5" y="8" width="3" height="8" rx="1" fill="currentColor"/>
      </svg></span>
      <span class="nm" id="cornername">Ti64 · Workload</span>
      <span class="cv">▾</span>
    </button>
    <div id="benchlist" role="menu" aria-label="Running workloads" data-open="0"></div>
  </div>
  <div></div>
  <div class="tabs" role="tablist" id="tabs" aria-label="Sessions"></div>
</div>

<div id="shellwrap">
  <div id="body">
    <aside id="side" aria-label="Workload tools">
      <div id="sideitems"></div>
    </aside>
    <div id="grip" tabindex="0" role="separator" aria-label="Resize sidebar (Alt+Left/Right)"></div>

    <main id="main" role="tabpanel" aria-label="Session"></main>

    <section id="gui" aria-label="GUI flavour desktop">
      <div id="tiles" role="grid" aria-label="Applications"></div>
    </section>
  </div>
</div>

<div id="dockrow">
  <button id="sidetoggle" title="Compress / expand the workload rail (Ctrl+B)"
          aria-expanded="true"><span id="sidetogglei">⇤</span><span id="sidetogglet">rail</span></button>
  <div class="dock" id="dock" aria-label="Live meters"></div>
</div>

<div class="inputrow"><span class="p">A:\&gt;</span>
  <input id="line" spellcheck="false" autocomplete="off" aria-label="Command line"
         placeholder="DIR · TREE · MEM · SAMPLE.TCB"></div>

<div class="reserved" role="status" aria-live="polite" style="position:relative;padding-left:0">
  <button id="start" aria-haspopup="menu" aria-expanded="false" aria-controls="menu"
          title="Master menu — Ctrl+Esc"><svg viewBox="0 0 20 26" aria-hidden="true"><defs>
      <linearGradient id="tiweld" x1="0" y1="0" x2="0.25" y2="1">
        <stop offset="0" stop-color="#EDEDEA"/>
        <stop offset=".16" stop-color="#E9C960"/>
        <stop offset=".30" stop-color="#D2894C"/>
        <stop offset=".44" stop-color="#B85A9E"/>
        <stop offset=".58" stop-color="#7D4FC0"/>
        <stop offset=".72" stop-color="#4763D2"/>
        <stop offset=".86" stop-color="#3A96DD"/>
        <stop offset="1" stop-color="#61D6D6"/>
      </linearGradient>
      <linearGradient id="tirim" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#F2F2F2" stop-opacity=".9"/>
        <stop offset=".5" stop-color="#F2F2F2" stop-opacity=".25"/>
        <stop offset="1" stop-color="#61D6D6" stop-opacity=".7"/>
      </linearGradient>
      <radialGradient id="tisheen" cx=".32" cy=".28" r=".85">
        <stop offset="0" stop-color="#FFFFFF" stop-opacity=".8"/>
        <stop offset=".35" stop-color="#FFFFFF" stop-opacity=".14"/>
        <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      </radialGradient>
    </defs>
      <path d="M10 1S1 12.2 1 17.4a9 9 0 0 0 18 0C19 12.2 10 1 10 1Z" fill="url(#tiweld)"
            stroke="url(#tirim)" stroke-width=".8"/>
      <path d="M10 1S1 12.2 1 17.4a9 9 0 0 0 18 0C19 12.2 10 1 10 1Z" fill="url(#tisheen)"/>
      <ellipse cx="6.6" cy="16.6" rx="2" ry="3.2" fill="#FFFFFF" opacity=".45"
               transform="rotate(-14 6.6 16.6)"/>
      <path d="M13.4 6.2c1.9 2.5 3.6 5.6 4.1 8.2" fill="none" stroke="#FFE9A8"
            stroke-opacity=".5" stroke-width=".7" stroke-linecap="round"/>
    </svg>Ti64</button>
  <span class="t" id="reserved">booting…</span>
  <span class="spacer"></span>
  <span class="t" id="budget"></span>
  <span id="layoutpick" role="group" aria-label="Layout"></span>

  <div id="menu" role="menu" aria-label="Master menu" data-open="0">
    <div class="banner">Ti-OS 0.2</div>
    <div class="cats" id="cats" aria-label="Categories"></div>
    <div class="items" id="items" aria-label="Entries"></div>
    <div class="find">
      <span class="hint">Find</span>
      <input id="find" placeholder="search every program, tool and document"
             aria-label="Search" autocomplete="off">
      <span class="hint">↑↓ move · → enter list · Enter open · Esc close</span>
    </div>
  </div>
</div>

<div class="overlay" id="switch" role="dialog" aria-modal="true" aria-label="Switch tab">
  <div class="sheet"><input id="sq" readonly value="Ctrl+Space — ↑↓ choose, Enter switch, Esc cancel">
    <ul id="slist" role="listbox"></ul></div>
</div>
<div class="overlay" id="help" role="dialog" aria-modal="true" aria-label="Keyboard map">
  <div class="sheet"><input readonly value="Keyboard map — F1 closes"><ul id="hlist"></ul></div>
</div>

<script src="console-core.js"></script>
<script src="console-v2.js"></script>
<script src="console-bodies.js"></script>
<script>
(function () {
  var T = window.TinyOS, RT = window.TinyOSRT, AG = window.TinyOSAgent, B = window.TinyOSBodies;
  var tabs = [], active = 0, secondary = 1, view = "os", sideW = 232;

  // ---- V1.1 host wiring (work/UX-V1 Part F) ---------------------------------
  // The browser-side Session is gone. Chrome verbs (open_tab / focus_tab /
  // read_console) are invoked HERE under the chrome identity; tab verbs (run_line /
  // read_tab / run_parity) are invoked only by each tab's own identity satellite
  // (tab.html), asked over the same-origin UI bus. No capability crosses the bus —
  // the resolver's disjoint grant tables decide everything, exactly as before.
  var invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;

  var busSeen = {}, busSeq = 0, busBC = null;
  try {
    busBC = new BroadcastChannel("ti64-ui");
    busBC.onmessage = function (e) { busAccept(e.data); };
  } catch (e) { /* storage path below still works */ }
  window.addEventListener("storage", function (e) {
    if (e.key === "ti64-ui" && e.newValue) {
      try { busAccept(JSON.parse(e.newValue)); } catch (x) { /* not ours */ }
    }
  });
  function busPost(m) {
    m.id = "c" + Math.random().toString(36).slice(2) + (++busSeq);
    if (busBC) busBC.postMessage(m);
    try { localStorage.setItem("ti64-ui", JSON.stringify(m)); } catch (e) { /* bc carried it */ }
  }

  var byLabel = {}, outbox = {}, satReady = {};
  function sendToTab(label, msg) {
    if (satReady[label]) { busPost(msg); return; }
    (outbox[label] = outbox[label] || []).push(msg);
  }
  function flushOutbox(label) {
    satReady[label] = true;
    (outbox[label] || []).forEach(function (m) { busPost(m); });
    outbox[label] = [];
  }

  // The Session-surface proxy the bodies and the chrome render from. Host-backed for
  // dos/parity; a display-model line buffer for rt/agent (Part F: they stay display
  // models until Phases 3/6 provide real state).
  function TabModel(kind, name) {
    this.tkind = kind;
    this.flavour = KIND[kind].flavour;
    this.session = name;
    this.hostLabel = null;
    this.lines = [];
    this.spoors = [];
    this.history = [];
    this.listeners = [];
    this.cwd = "\\";
    this.vol = { label: "TINYOS", serial: "1234-ABCD" };
    this.env = {};
    this.consumed = 0;   // chars of the host transcript already classified
  }
  TabModel.prototype.prompt = function () { return T.FLAVOURS[this.flavour].prompt(this.cwd); };
  TabModel.prototype.on = function (fn) { this.listeners.push(fn); };
  TabModel.prototype.emit = function (cls, text) {
    var line = { c: cls, s: text };
    this.lines.push(line);
    if (this.lines.length > 5000) this.lines.shift();   // SPEC §6 ring
    for (var i = 0; i < this.listeners.length; i++) this.listeners[i](line, this);
  };
  TabModel.prototype.out = function (t) { this.emit("out", t); };
  TabModel.prototype.run = function (raw) {
    var line = (raw || "").trim();
    if (!line) return;
    this.history.push(line);
    if (this.hostLabel) {
      sendToTab(this.hostLabel, { type: "run", label: this.hostLabel, line: line });
    } else if (this.tkind === "dos" || this.tkind === "parity") {
      (this.pending = this.pending || []).push(line);   // open_tab still in flight
    } else {
      this.emit("meta", "no host session behind this tab — line not run");

  // LE-59, EPIC-P2 §6.5 rule 3: colour is applied by the renderer over CLASSIFIED
  // output — the payload carries no escapes. Classification is over the real shell's
  // register shapes (os/src/shell/src/verbs.rs strings).
  function classify(s) {
    if (/^Access denied/.test(s)) return "deny";
    if (/^(Bad command or file name|File not found|Invalid )/.test(s)) return "err";
    if (/^Environment variable \S+ not defined$/.test(s)) return "err";
    if (/^(A:[^>]*>|tinyos:[^$]*\$ |rt> )/.test(s)) return "echo";
    return "out";
  }

  function onTabSnapshot(m) {
    var s = byLabel[m.label];
    if (!s) return;
    var structural = false;
    if (typeof m.transcript === "string" && m.transcript.length > s.consumed) {
      var chunk = m.transcript.slice(s.consumed);
      var upto = chunk.lastIndexOf("\n");
      if (upto >= 0) {
        s.consumed += upto + 1;
        chunk.slice(0, upto).split("\n").forEach(function (raw) {
          var c = classify(raw);
          if (c === "deny") {
            s.spoors.push({ cat: "shell", actor: "session", act: "verb-denied",
              out: "failed", target: raw, cost: 0 });
            structural = true;
          }
          if (c === "echo") {
            var cm = raw.match(/^A:([^>]*)>/);
            if (cm && cm[1] !== s.cwd) { s.cwd = cm[1] || "\\"; structural = true; }
          }
          s.emit(c, raw);

      }
    }
    if (m.suite) {
      var p = m.suite.overall ? (m.suite.overall.kind === "Pass" ? "PASS" : "FAIL")

      if (p !== B.state.parity) { B.state.parity = p; structural = true; }

      document.querySelector(".inputrow .p").textContent = tabs[active].prompt();
    }

  }
  function side(open) {
    document.body.dataset.side = open ? "1" : "0";
    var t = document.getElementById("sidetoggle");
    t.setAttribute("aria-expanded", open);
    document.getElementById("sidetogglei").textContent = open ? "⇤" : "⇥";
    document.getElementById("sidetogglet").textContent = open ? "compress" : "";
    document.getElementById("sidetoggle").style.width = open ? "var(--side-w, 232px)" : "46px";
    sidebar();
  }
  document.getElementById("sidetoggle").onclick = function () {
    side(document.body.dataset.side === "0");
  };
  function setW(w) {
    sideW = Math.max(150, Math.min(420, w));
    document.getElementById("body").style.setProperty("--side-w", sideW + "px");
  }
  var grip = document.getElementById("grip"), dragging = false;
  grip.addEventListener("mousedown", function () { dragging = true; document.body.style.userSelect = "none"; });
  window.addEventListener("mouseup", function () { dragging = false; document.body.style.userSelect = ""; });
  window.addEventListener("mousemove", function (e) { if (dragging) setW(e.clientX); });
  grip.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { setW(sideW - 16); e.preventDefault(); }
    if (e.key === "ArrowRight") { setW(sideW + 16); e.preventDefault(); }
  });

  // ---- GUI flavour -----------------------------------------------------------
  var GLYPH = { devtools: "⚒", regress: "✓", cpu: "▤", mem: "▥", pf: "◫", speed: "⏱", vuln: "⚿",
                tasks: "☰", ipc: "⇄", net: "⌁", work: "⚙", risk: "☡", flags: "⚑" };
  var tiles = document.getElementById("tiles");
  T.WORKBENCH.forEach(function (w) {
    var b = document.createElement("button");
    b.className = "tile"; b.dataset.state = w.state; b.setAttribute("role", "gridcell"); b.title = w.detail;
    b.innerHTML = "<span class='glyph'></span><span class='t'></span><span class='v'></span>";
    b.children[0].textContent = w.ic || GLYPH[w.id] || "▢";
    b.children[1].textContent = w.t; b.children[2].textContent = w.v;
    b.onclick = function () {
      gui(false); var s = tabs[active];
      if (w.verb) s.run(w.verb); else s.emit("meta", w.t + ": " + w.detail);
      renderMain();
    };
    tiles.appendChild(b);
  });
  [["◎", "RT OPERATOR PANEL", "mode · DRO · interlocks", function () { gui(false); newTab("rt"); }],
   ["◈", "LOCAL MODEL", "proposal gate · token budget", function () { gui(false); newTab("agent"); }],
   ["▮", "TINYCMD", "Ti-OS command session", function () { gui(false); }]].forEach(function (p) {
    var b = document.createElement("button");
    b.className = "tile"; b.dataset.state = "live"; b.setAttribute("role", "gridcell");
    b.innerHTML = "<span class='glyph'></span><span class='t'></span><span class='v'></span>";
    b.children[0].textContent = p[0]; b.children[1].textContent = p[1]; b.children[2].textContent = p[2];
    b.onclick = p[3];
    tiles.appendChild(b);
  });
  T.rove(tiles, ".tile");
  function gui(on) {
    document.body.dataset.gui = on ? "1" : "0";
    (on ? tiles.querySelector(".tile") : document.getElementById("line")).focus();
  }

  // ---- tab switcher ----------------------------------------------------------
  var swi = 0;
  function openSwitch() {
    var o = document.getElementById("switch"), list = document.getElementById("slist");
    o.dataset.open = "1"; swi = (active + 1) % tabs.length; paint();
    function paint() {
      list.textContent = "";
      tabs.forEach(function (s, i) {
        var li = document.createElement("li");
        li.setAttribute("role", "option"); li.setAttribute("aria-selected", i === swi);
        li.innerHTML = "<span class='k2'></span><span class='d'></span>";
        li.children[0].textContent = "Ctrl+" + (i + 1) + "  " + s.session;
        li.children[1].textContent = KIND[s.tkind].label + " · " + s.lines.length + " lines";
        li.onclick = function () { swi = i; commit(); };
        list.appendChild(li);
      });
    }
    function commit() { o.dataset.open = "0"; select(swi); document.getElementById("line").focus(); }
    document.getElementById("sq").focus();
    o.addEventListener("keydown", function h(e) {
      if (o.dataset.open !== "1") { o.removeEventListener("keydown", h); return; }
      if (e.key === "ArrowDown") { swi = (swi + 1) % tabs.length; paint(); e.preventDefault(); }
      else if (e.key === "ArrowUp") { swi = (swi - 1 + tabs.length) % tabs.length; paint(); e.preventDefault(); }
      else if (e.key === "Enter") { commit(); e.preventDefault(); }
      else if (e.key === "Escape") { o.dataset.open = "0"; document.getElementById("line").focus(); }
    });
  }

  // F8 runs the REAL three-signal suite: run_parity resolves only under the parity
  // tab's own identity, so the intent travels the bus to that tab's satellite. A
  // missing parity tab is opened first (open_tab — a chrome verb, this identity's own).
  function runParitySuite() {
    var p = null;
    tabs.forEach(function (t) { if (t.tkind === "parity") p = t; });
    if (!p) p = newTab("parity");
    var ask = function () {
      if (p.hostLabel) sendToTab(p.hostLabel, { type: "parity", label: p.hostLabel });
      else setTimeout(ask, 150);   // open_tab is in flight
    };
    ask();
  }

  // ---- prompt ----------------------------------------------------------------
  var input = document.getElementById("line");
  input.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var s = tabs[active], line = input.value.trim();
    if (!line) return;
    input.value = "";
    if (s.tkind === "rt") rtLine(s, line);
    else if (s.tkind === "agent") agentLine(s, line);
    else { s.run(line); document.querySelector(".inputrow .p").textContent = s.prompt(); }
    renderMain(); host();
  });
  function rtLine(s, line) {
    s.emit("echo", s.prompt() + line);
    var p = line.split(/\s+/), v = p[0].toUpperCase();
    if (v === "MODE" && p[1]) {
      var mo = p[1].toUpperCase();
      if (RT.modes.indexOf(mo) < 0) s.emit("err", "no such mode");
      else { RT.mode = mo; s.out("mode " + mo + " (ACI: control.mode, audited)"); }
    } else if (v === "JOG" && p[2]) ctx.jog(p[1].toUpperCase(), parseFloat(p[2]));
    else if (v === "OVR" && p[2]) {
      var k = p[1].toLowerCase();
      if (RT.overrides[k] === undefined) s.emit("err", "no such override");
      else { RT.overrides[k] = +p[2]; s.out(k + " override " + p[2] + "%"); }
    } else if (v === "DRO") {
      RT.axes.forEach(function (a) {
        s.out("  " + a.n + "  machine " + a.m.toFixed(3) + "  work " + a.w.toFixed(3) + "  " + a.unit);
      });
      s.emit("meta", "  feedback: simulated (Tier 0) — not a validated position");
    } else if (v === "ALARM") {
      if (!RT.alarms.length) s.emit("meta", "no active alarms");
      else RT.alarms.forEach(function (a) { s.emit("err", a.id + "  " + a.t); });
    } else if (v === "ESTOP") {
      s.emit("meta", "E-stop is out of band: wired to the watchdog/failsafe path, it cannot be " +
        "asserted, masked or cleared from this console.");
    } else s.emit("err", "Bad command or file name");
  }
  function agentLine(s, line) {
    s.emit("echo", "» " + line);
    AG.proposals.push({ cap: "shell.list", args: "A:\\", tokens: 28 + (line.length % 20),
      risk: "read", state: "pending", why: "from prompt: " + line });
    s.emit("meta", "the model proposed 1 capability call — approve or deny it in the gate; " +
      "nothing executes until you do");
  }

  // ---- master menu -----------------------------------------------------------
  // The non-command-prompt entry point: programs, tools, documents, settings, search.
  // Everything it launches is the same verb or tab a keyboard user would reach — it opens
  // no path the ACI gate does not already own.
  var MENU = [
    { g: "▣", t: "Programs", items: [
      { g: "▮", t: "TINYCMD", d: "Ti-OS MS-DOS command session", act: function () { newTab("dos"); } },
      { g: "❯", t: "TINYSH (Linux flavour)", d: "POSIX front-end over the same verbs", act: function () { newTab("posix"); } },
      { g: "◎", t: "RT Operator Panel", d: "mode · DRO · overrides · interlocks", act: function () { newTab("rt"); } },
      { g: "◈", t: "Local Model", d: "proposal gate · token budget", act: function () { newTab("agent"); } },
      { g: "✓", t: "Parity Suite", d: "three-signal MS-DOS conformance", act: function () { newTab("parity"); } },
      { g: "☰", t: "Task Monitor", d: "TASKMGR in this session", act: function () { tabs[active].run("TASKMGR"); } },
      { g: "▦", t: "GUI Desktop", d: "tile shell — F12", act: function () { gui(true); } }
    ] },
    { g: "⚒", t: "Workload tools", items: T.WORKBENCH.map(function (w) {
      return { g: "•", t: w.t, d: w.detail, state: w.state, act: function () {
        var s = tabs[active];
        if (w.verb) s.run(w.verb); else s.emit("meta", w.t + ": " + w.detail);
      } };
    }) },
    { g: "▤", t: "Documents", items: [
      { g: "▪", t: "README.TXT", d: "99 bytes · seeded · operator", act: function () { tabs[active].run("TYPE README.TXT"); } },
      { g: "▪", t: "LIST.TXT", d: "25 bytes · seeded · operator", act: function () { tabs[active].run("TYPE LIST.TXT"); } },
      { g: "▸", t: "SAMPLE.TCB", d: "batch — runs through the real .TCB runner", act: function () { tabs[active].run("SAMPLE.TCB"); } },
      { g: "▤", t: "Directory of A:\\", d: "DIR", act: function () { tabs[active].run("DIR"); } },
      { g: "⌸", t: "Volume labels", d: "ATTRIB — origin and trust per file", act: function () { tabs[active].run("ATTRIB"); } }
    ] },
    { g: "⚙", t: "Settings", items: [
      { g: "▭", t: "Layout: Focus", d: "one pane, workbench collapsed", act: function () { setLayout("focus"); } },
      { g: "▯", t: "Layout: Cockpit", d: "session + live column", act: function () { setLayout("cockpit"); } },
      { g: "◫", t: "Layout: Split", d: "two tabs at once", act: function () { setLayout("split"); } },
      { g: "⇤", t: "Compress the rail", d: "Ctrl+B", act: function () { side(document.body.dataset.side === "0"); } },
      { g: "⚑", t: "Modes and flags", d: "VER — deployment mode, target, knobs", act: function () { tabs[active].run("VER"); } }
    ] },
    { g: "?", t: "Help", items: [
      { g: "⌨", t: "Keyboard map", d: "every key this console answers to", act: function () { document.getElementById("help").dataset.open = "1"; } },
      { g: "⚿", t: "Authority journal", d: "SPOOR — denials, journaled", act: function () { tabs[active].run("SPOOR"); } },
      { g: "⏻", t: "Shut down…", d: "safe hold — a console cannot power the machine down", act: function () {
        tabs[active].emit("meta", "Shutdown is not a console authority: the RT core transitions to a " +
          "safe hold state through the watchdog path, never because a UI asked."); } }
    ] }
  ];

  var mOpen = false, mCat = 0, mItem = -1, mFilter = "";
  var menu = document.getElementById("menu"), startBtn = document.getElementById("start");
  function menuItems() {
    if (mFilter) {
      var out = [];
      MENU.forEach(function (c) {
        c.items.forEach(function (it) {
          if ((it.t + " " + it.d).toLowerCase().indexOf(mFilter) >= 0)
            out.push({ g: it.g, t: it.t, d: c.t + " · " + it.d, state: it.state, act: it.act });
        });
      });
      return out;
    }
    return MENU[mCat].items;
  }
  function paintMenu() {
    var cats = document.getElementById("cats"), items = document.getElementById("items");
    cats.textContent = "";
    MENU.forEach(function (c, i) {
      var b = document.createElement("button");
      b.innerHTML = "<span class='g'></span><span></span><span class='arw'>▸</span>";
      b.children[0].textContent = c.g; b.children[1].textContent = c.t;
      b.setAttribute("aria-selected", !mFilter && i === mCat);
      b.onclick = function () { mCat = i; mFilter = ""; document.getElementById("find").value = ""; mItem = -1; paintMenu(); };
      cats.appendChild(b);
    });
    items.textContent = "";
    menuItems().forEach(function (it, i) {
      var b = document.createElement("button");
      b.dataset.state = it.state || "live";
      b.innerHTML = "<span class='g'></span><span><b></b><span class='d'></span></span>";
      b.children[0].textContent = it.g;
      b.children[1].children[0].textContent = it.t;
      b.children[1].children[1].textContent = it.d;
      b.setAttribute("aria-selected", i === mItem);
      b.onclick = function () { closeMenu(); it.act(); ctx.repaint(); };
      items.appendChild(b);
    });
  }
  function openMenu() {
    mOpen = true; menu.dataset.open = "1"; startBtn.setAttribute("aria-expanded", "true");
    mItem = -1; paintMenu(); document.getElementById("find").focus();
  }
  function closeMenu() {
    mOpen = false; menu.dataset.open = "0"; startBtn.setAttribute("aria-expanded", "false");
    mFilter = ""; document.getElementById("find").value = "";
    document.getElementById("line").focus();
  }
  startBtn.onclick = function () { mOpen ? closeMenu() : openMenu(); };
  document.getElementById("find").addEventListener("input", function (e) {
    mFilter = e.target.value.trim().toLowerCase(); mItem = mFilter ? 0 : -1; paintMenu();
  });
  menu.addEventListener("keydown", function (e) {
    var list = menuItems();
    if (e.key === "Escape") { closeMenu(); e.preventDefault(); }
    else if (e.key === "ArrowDown") {
      if (mItem < 0 && !mFilter) { mCat = (mCat + 1) % MENU.length; }
      else mItem = Math.min(list.length - 1, mItem + 1);
      paintMenu(); e.preventDefault();
    } else if (e.key === "ArrowUp") {
      if (mItem <= 0 && !mFilter) { mCat = (mCat - 1 + MENU.length) % MENU.length; mItem = -1; }
      else mItem = Math.max(0, mItem - 1);
      paintMenu(); e.preventDefault();
    } else if (e.key === "ArrowRight") { mItem = 0; paintMenu(); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { mItem = -1; paintMenu(); e.preventDefault(); }
    else if (e.key === "Enter" && list[mItem]) { var a = list[mItem].act; closeMenu(); a(); ctx.repaint(); e.preventDefault(); }
  });
  document.addEventListener("mousedown", function (e) {
    if (mOpen && !menu.contains(e.target) && e.target !== startBtn) closeMenu();
  });

  // ---- keyboard --------------------------------------------------------------
  var MAP = [
    ["Ctrl+Esc", "master menu — programs, workbench, documents, settings, search"],
    ["Top-left corner", "the running workload — its tools fill the rail below it"],
    ["Ctrl+Shift+1/2/3", "layout: focus · cockpit · split"],
    ["Ctrl+\\", "split view: pin the next tab as the second pane"],
    ["Ctrl+B", "compress / expand the workload rail"],
    ["Ctrl+Shift+W", "switch running workload — Ti64 · developer · agent · RT · search"],
    ["Alt+← / Alt+→", "resize the rail"],
    ["Ctrl+Space", "tab switcher"], ["Ctrl+Tab", "next tab"], ["Ctrl+1…6", "tab by ordinal"],
    ["Ctrl+T", "new tab of the focused kind"],
    ["F8", "run the parity suite"], ["F12", "GUI flavour, and back"],
    ["RT tab", "MODE AUTO · JOG X +0.1 · OVR FEED 80 · DRO · ALARM · ESTOP"],
    ["F1", "this map"]
  ];
  var hl = document.getElementById("hlist");
  MAP.forEach(function (m) {
    var li = document.createElement("li");
    li.innerHTML = "<span class='k2'></span><span class='d'></span>";
    li.children[0].textContent = m[0]; li.children[1].textContent = m[1];
    hl.appendChild(li);
  });
  document.addEventListener("keydown", function (e) {
    var h = document.getElementById("help");
    if (e.ctrlKey && e.key === "Escape") { mOpen ? closeMenu() : openMenu(); e.preventDefault(); }
    else if (e.key === "F1") { h.dataset.open = h.dataset.open === "1" ? "0" : "1"; e.preventDefault(); }
    else if (e.key === "Escape") { h.dataset.open = "0"; if (document.body.dataset.gui === "1") gui(false); }
    else if (e.key === "F12") { gui(document.body.dataset.gui === "0"); e.preventDefault(); }
    else if (e.key === "F8") { runParitySuite(); e.preventDefault(); }
    else if (e.ctrlKey && e.shiftKey && /^[!@#123]$/.test(e.key)) {
      setLayout(["focus", "cockpit", "split"][{ "!": 0, "@": 1, "#": 2, "1": 0, "2": 1, "3": 2 }[e.key]]);
      e.preventDefault();
    }
    else if (e.ctrlKey && e.shiftKey && /^[wW]$/.test(e.key)) {
      document.getElementById("benchlist").dataset.open === "1" ? closeBench() : openBench();
      e.preventDefault();
    }
    else if (e.ctrlKey && e.key === "\\") {
      secondary = (secondary + 1) % tabs.length;
      if (secondary === active) secondary = (secondary + 1) % tabs.length;
      if (layout !== "split") setLayout("split"); else { paintTabs(); renderMain(); }
      e.preventDefault();
    }
    else if (e.ctrlKey && (e.key === "b" || e.key === "B")) { side(document.body.dataset.side === "0"); e.preventDefault(); }
    else if (e.ctrlKey && e.key === " ") { openSwitch(); e.preventDefault(); }
    else if (e.ctrlKey && e.key === "Tab") { select((active + 1) % tabs.length); e.preventDefault(); }
    else if (e.ctrlKey && /^[1-6]$/.test(e.key)) { if (tabs[+e.key - 1]) select(+e.key - 1); e.preventDefault(); }
    else if (e.ctrlKey && (e.key === "t" || e.key === "T")) { newTab(tabs[active].tkind); e.preventDefault(); }
    else if (e.altKey && e.key === "ArrowLeft") { setW(sideW - 16); e.preventDefault(); }
    else if (e.altKey && e.key === "ArrowRight") { setW(sideW + 16); e.preventDefault(); }
  });

  // ---- boot ------------------------------------------------------------------
  T.mountMeters(document.getElementById("dock"), ["cpu", "mem", "tests", "parity", "deny", "pf"]);
  side(document.body.dataset.side === "1");
  var first = newTab("dos");
  ["VER", "DIR", "SET", "TASKMGR", "TASKKILL RT-CTRL", "TYPE README.TXT"].forEach(function (l) {
    first.run(l);
  });
  newTab("rt");
  newTab("agent");
  select(0);
  T.tickers.push(function () {
    document.getElementById("budget").textContent =
      T.countNodes() + " nodes · " + T.stats.paint + " ms · 4 Hz · " + tabs.length + " tab(s)";
  });

  // Part F seam 4 + the "denials visible, never swallowed" invariant: the chrome polls
  // read_console (its own verb) and paints every NEW resolver denial into the focused
  // transcript as host commentary in the denial colour. Nothing is swallowed.
  if (invoke) {
    var denCount = null, denBusy = false;
    T.tickers.push(function () {
      if (denBusy) return;
      denBusy = true;
      invoke("read_console").then(function (snap) {
        if (denCount === null) denCount = 0;
        var fresh = snap.denials.length > denCount;
        // Paint into a tab whose body renders a transcript (the focused one when it
        // does; else the first shell tab) — a denial in a bufferless panel would be
        // recorded but not seen, and "visible" means on screen.
        var target = tabs[active];
        if (!target || (target.tkind !== "dos" && target.tkind !== "posix")) {
          for (var j = 0; j < tabs.length; j++) {
            if (tabs[j].tkind === "dos" || tabs[j].tkind === "posix") { target = tabs[j]; break; }
          }
        }
        for (var i = denCount; i < snap.denials.length; i++) {
          var d = snap.denials[i];
          if (target) target.emit("deny",
            "DENIED " + d.command + " (webview=" + d.webview + ", origin=" + d.origin + "): " + d.reason);
        }
        denCount = snap.denials.length;
        if (fresh) renderMain();
      }).catch(function () {}).then(function () { denBusy = false; });
    });
  }

  // STORY-UX-04: the unattended smoke drives the keyboard grammar, not the mouse.
  window.smokeKey = function (name) {
    if (name.indexOf("type-line:") === 0) {
      input.value = name.slice(10); input.focus(); return;
    }
    if (name === "Enter") {
      input.dispatchEvent(new KeyboardEvent("keydown", { key: "Enter", bubbles: true, cancelable: true }));
      return;
    }
    var parts = name.split("+"), key = parts.pop();
    document.dispatchEvent(new KeyboardEvent("keydown", {
      key: key,
      ctrlKey: parts.indexOf("Ctrl") >= 0,
      shiftKey: parts.indexOf("Shift") >= 0,
      altKey: parts.indexOf("Alt") >= 0,
      bubbles: true, cancelable: true
    }));
  };
  // Authority probes from the chrome identity: an unlisted verb, then a tab verb —
  // both must be denied at the resolver and land, visibly, in the transcript above.
  window.smokeDenials = function () {
    if (!invoke) return;
    invoke("format_disk").catch(function () {});
    invoke("run_line", { line: "DIR" }).catch(function () {});
  };

  T.startClock();
  input.focus();
})();
</script>
</body>
