<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TinyOS operator console — chrome</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1117; color: #c9d1d9; height: 100vh; overflow: hidden;
    font: 13px/1.4 Consolas, "Cascadia Mono", monospace;
    display: flex; flex-direction: column;
  }
  #bar { display: flex; gap: 6px; align-items: center; padding: 6px 10px 0; }
  .tab {
    padding: 5px 14px; border: 1px solid #30363d; border-bottom: 0;
    border-radius: 6px 6px 0 0; background: #161b22; cursor: pointer; white-space: nowrap;
  }
  .tab.focused { background: #05070c; color: #58a6ff; border-color: #58a6ff; font-weight: bold; }
  .tab .kind { color: #8b949e; font-size: 11px; margin-left: 6px; }
  .tab.focused .kind { color: #388bfd; }
  button.new {
    background: #21262d; color: #c9d1d9; border: 1px dashed #30363d; border-radius: 4px;
    padding: 4px 10px; font: inherit; cursor: pointer;
  }
  button.new:hover { border-color: #58a6ff; }
  #status { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  #denbadge { color: #ffa198; }
  #unlisted { background: #21262d; border: 1px solid #30363d; color: #d29922;
    border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
  #panes { border-top: 1px solid #30363d; margin-top: 6px; flex: 1; overflow-y: auto;
    font-size: 12px; }
  #denials { color: #ffa198; padding: 3px 10px; white-space: pre-wrap; }
  #denials:empty::before { content: "no authority denials"; color: #484f58; }
</style>
</head>
<body>
<div id="bar">
  <span id="tabs"></span>
  <button class="new" id="newdos">+ DOS tab</button>
  <button class="new" id="newparity">+ parity tab</button>
  <span id="status">
    <button id="unlisted" title="invokes a verb the signed manifest does not enumerate">try unlisted verb</button>
    <span id="denbadge"></span>
  </span>
</div>
<div id="panes"><div id="denials"></div></div>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const $ = (id) => document.getElementById(id);

  $("newdos").onclick = () => invoke("open_tab", { kind: "dos" }).catch(() => {});
  $("newparity").onclick = () => invoke("open_tab", { kind: "parity" }).catch(() => {});
  $("unlisted").onclick = () =>
    invoke("format_disk").catch(() => {}); // the denial lands in the visible log

  async function poll() {
    try {
      const snapshot = await invoke("read_console");
      const bar = $("tabs");
      bar.innerHTML = "";
      for (const tab of snapshot.tabs) {
        const el = document.createElement("span");
        el.className = "tab" + (snapshot.focused === tab.label ? " focused" : "");
        el.textContent = tab.label + " [" + tab.session + "]";
        const kind = document.createElement("span");
        kind.className = "kind";
        kind.textContent = tab.kind === "parity" ? "TARGET-PARITY" : "DOS";
        el.append(kind);
        el.onclick = () => invoke("focus_tab", { label: tab.label }).catch(() => {});
        bar.append(el);
      }
      $("denbadge").textContent = snapshot.denials.length
        ? snapshot.denials.length + " denial(s)" : "";
      $("denials").textContent = snapshot.denials
        .map((d) => "DENIED " + d.command + " (webview=" + d.webview + ", origin=" + d.origin + "): " + d.reason)
        .join("\n");
    } catch (e) { /* keep polling */ }
  }
  setInterval(poll, 250);
  poll();

  // Smoke hooks — each travels the real UI path from the chrome identity.
  window.smokeOpenTabs = async () => {
    await invoke("open_tab", { kind: "dos" }).catch(() => {});
    await invoke("open_tab", { kind: "dos" }).catch(() => {});
    await invoke("open_tab", { kind: "parity" }).catch(() => {});
  };
  window.smokeFocus = (label) => invoke("focus_tab", { label }).catch(() => {});
  window.smokeDenials = async () => {
    await invoke("format_disk").catch(() => {});      // unlisted verb
    await invoke("run_line", { line: "DIR" }).catch(() => {}); // tab verb from chrome identity
  };
</script>
</body>
</html>
