<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TinyOS operator console — Stage E</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0d1117; color: #c9d1d9;
    font: 13px/1.5 Consolas, "Cascadia Mono", monospace;
    display: grid; grid-template-rows: auto auto 1fr auto; height: 100vh;
  }
  header {
    padding: 8px 12px; background: #161b22; border-bottom: 1px solid #30363d;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  header .title { font-weight: bold; color: #58a6ff; margin-right: auto; }
  input, button {
    background: #0d1117; color: #c9d1d9; border: 1px solid #30363d;
    padding: 4px 10px; font: inherit; border-radius: 4px;
  }
  button { cursor: pointer; background: #21262d; }
  button:hover { border-color: #58a6ff; }
  #verdict { padding: 2px 10px; border-radius: 4px; font-weight: bold; }
  .verdict-none { background: #21262d; }
  .verdict-pass { background: #1a7f37; color: #fff; }
  .verdict-fail { background: #b62324; color: #fff; }
  .verdict-other { background: #9e6a03; color: #fff; }
  #manifest-bar {
    padding: 4px 12px; background: #161b22; border-bottom: 1px solid #30363d;
    color: #8b949e;
  }
  #manifest-bar b { color: #d2a8ff; }
  #stream {
    overflow-y: auto; padding: 8px 12px; white-space: pre-wrap; word-break: break-all;
  }
  #stream .xtask-line { color: #8b949e; }
  #panes { display: grid; grid-template-rows: auto auto; max-height: 40vh; }
  #denials {
    border-top: 1px solid #30363d; background: #180d0d; color: #ffa198;
    padding: 6px 12px; max-height: 20vh; overflow-y: auto;
  }
  #denials:empty::before { content: "no authority denials"; color: #484f58; }
  #errors { border-top: 1px solid #30363d; background: #161b22; color: #d29922;
    padding: 6px 12px; max-height: 20vh; overflow-y: auto; }
  #errors:empty::before { content: "no command errors"; color: #484f58; }
</style>
</head>
<body>
<header>
  <span class="title">TinyOS operator console</span>
  <input id="fixture" value="measure" size="18" title="fixture name; empty = default boot">
  <button id="launch">Launch fixture</button>
  <button id="terminate">Terminate</button>
  <input id="line" size="18" placeholder="line to send">
  <button id="send">Send line</button>
  <button id="unlisted" title="invokes a verb the signed manifest does not enumerate">Try unlisted verb</button>
  <span id="verdict" class="verdict-none">no verdict</span>
</header>
<div id="manifest-bar">signed manifest verbs: <b id="verbs">…</b></div>
<div id="stream"></div>
<div id="panes">
  <div id="denials"></div>
  <div id="errors"></div>
</div>
<script>
  const invoke = window.__TAURI__.core.invoke;
  const $ = (id) => document.getElementById(id);
  const errors = [];

  function showError(source, message) {
    errors.push(`[${source}] ${message}`);
    $("errors").textContent = errors.slice(-20).join("\n");
  }

  $("launch").onclick = () =>
    invoke("launch_fixture", { fixture: $("fixture").value.trim() })
      .then((message) => showError("launch", message))
      .catch((error) => showError("launch", `REFUSED: ${error}`));
  $("terminate").onclick = () =>
    invoke("terminate")
      .then((message) => showError("terminate", message))
      .catch((error) => showError("terminate", `REFUSED: ${error}`));
  $("send").onclick = () =>
    invoke("send_line", { line: $("line").value })
      .then(() => showError("send_line", "sent"))
      .catch((error) => showError("send_line", `${error}`));
  $("unlisted").onclick = () =>
    invoke("format_disk")
      .then(() => showError("format_disk", "UNEXPECTEDLY ALLOWED"))
      .catch((error) => showError("format_disk", `DENIED (as it must be): ${error}`));

  function renderVerdict(verdict) {
    const el = $("verdict");
    if (!verdict) { el.textContent = "no verdict"; el.className = "verdict-none"; return; }
    if (verdict.kind === "Pass") { el.textContent = "PASS"; el.className = "verdict-pass"; }
    else if (verdict.kind === "Fail") { el.textContent = "FAIL"; el.className = "verdict-fail"; }
    else { el.textContent = `${verdict.kind}: ${verdict.detail ?? ""}`; el.className = "verdict-other"; }
  }

  async function poll() {
    try {
      const snapshot = await invoke("read_stream");
      $("verbs").textContent = snapshot.manifest_verbs.join(", ");
      const stream = $("stream");
      const stick = stream.scrollTop + stream.clientHeight >= stream.scrollHeight - 4;
      stream.textContent = snapshot.lines.join("\n");
      if (stick) stream.scrollTop = stream.scrollHeight;
      renderVerdict(snapshot.verdict);
      $("denials").textContent = snapshot.denials
        .map((d) => `DENIED ${d.command} (webview=${d.webview}, origin=${d.origin}): ${d.reason}`)
        .join("\n");
    } catch (error) {
      showError("read_stream", `REFUSED: ${error}`);
    }
  }
  setInterval(poll, 250);
  poll();

  // Smoke sequence, driven from the page so every step travels the real UI path:
  // launch → wait for verdict → invoke an unlisted verb → the Rust observer sees
  // verdict + denial in shared state and writes the evidence file.
  window.smokeRun = async () => {
    try { await invoke("launch_fixture", { fixture: "measure" }); }
    catch (error) { showError("smoke", `launch failed: ${error}`); }
    const wait = setInterval(async () => {
      const snapshot = await invoke("read_stream").catch(() => null);
      if (snapshot && snapshot.verdict) {
        clearInterval(wait);
        await invoke("send_line", { line: "DIR" }).catch((e) => showError("smoke/send_line", `${e}`));
        await invoke("format_disk").catch((e) => showError("smoke/format_disk", `DENIED: ${e}`));
      }
    }, 500);
  };
</script>
</body>
</html>
