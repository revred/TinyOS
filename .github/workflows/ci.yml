name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # LE-23's baseline recorder only. Every other job here runs on push and
  # pull_request as before; the recorder is gated on this event, so a manual
  # run records a baseline and does nothing else.
  workflow_dispatch:

defaults:
  run:
    working-directory: os

jobs:
  governance-gates:
    name: Format, lint, size, assurance, missing_docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --profile minimal --component rustfmt --component clippy --component rust-src "$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)"

      - name: rustfmt check
        run: cargo fmt --all -- --check

      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: crate-size ceiling (20,000 LOC excluding tests)
        run: cargo run -p xtask -- check-crate-sizes --ceiling=20000

      - name: Performance catalogue integrity (625 tests)
        run: cargo run -p xtask -- check-performance-catalogue

      - name: Assurance spine coverage (Stories, performance, security)
        run: cargo run -p xtask -- check-assurance-spine

      - name: missing_docs check
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D missing-docs"

      # TEST-P1-07-01-A clause 2, upgraded by STORY-P1-07-05. This used to
      # build only the hal-arm64 *library*, because nothing in the workspace
      # linked an AArch64 binary; pi5-image now does, so the step builds the
      # bootable binary and thereby also proves the target spec, the boot
      # stub's inline assembly, the linker script and the `VolatileMmio` seam
      # all still LINK — the failure class `build-std=core`'s missing
      # memcpy/memcmp made invisible to a library-only build. The flattening
      # to kernel8.img stays out of CI: hardware runs are manual and land in
      # Reports (FEAT-P1-07 §7.4, decision b).
      #
      # `compiler_builtins` with `compiler-builtins-mem` is not optional: a
      # `build-std=core` alone leaves memcpy/memcmp undefined at link time.
      - name: AArch64 target spec links the Pi 5 boot image (STORY-P1-07-01/-05)
        run: >
          cargo build -p pi5-image
          --target targets/aarch64-tinyos.json
          -Z build-std=core,compiler_builtins
          -Z build-std-features=compiler-builtins-mem
          -Z json-target-spec

      - name: clippy on the AArch64 build (-D warnings)
        run: >
          cargo clippy -p hal-arm64
          --target targets/aarch64-tinyos.json
          -Z build-std=core,compiler_builtins
          -Z build-std-features=compiler-builtins-mem
          -Z json-target-spec
          -- -D warnings

  governance-fixture-smoke-test:
    name: TEST-P0-01-02-A — fixtures actually catch what they claim to
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: |
          rustup toolchain install --profile minimal --component rustfmt --component clippy "$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)"
      - name: Run fixture smoke test
        run: cargo run -p xtask -- governance-fixture-test

  kernel-boot-x86_64:
    name: TEST-P0-01-01-A / TEST-P0-01-03-A — kernel boots to halt under QEMU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly toolchain + rust-src
        run: |
          rustup toolchain install --profile minimal --component rust-src "$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)"
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Boot kernel (expect success)
        run: cargo run -p xtask -- qemu-x86_64
      # STORY-P0-01-04 closed the exit-code hole this step carried for three
      # mandates. Exit 1 alone was never sufficient: every other failure also
      # exits 1, so the assertion could not tell "panicked as designed" from
      # "broke". The blocker was that there was nothing to grep — the panic
      # handler was a bare exit_qemu and this fixture produced an *empty*
      # serial capture. Panics now report themselves on COM1, so the
      # assertion can key on the deliberate panic's own message.
      - name: TEST-P0-01-03-A — deliberately-broken boot fails closed, for the stated reason
        run: |
          set +e
          cargo run -p xtask -- qemu-x86_64 --fixture=broken-boot --serial-capture=broken-boot.log
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected xtask exit code 1 (KernelBootFailed) for the broken-boot fixture, got $code"
            cat broken-boot.log || true
            exit 1
          fi
          if ! grep -q 'TOS64-PANIC/1 message=fixture-broken-boot: deliberate panic' broken-boot.log; then
            echo "broken-boot exited 1 but not from its own deliberate panic:"
            cat broken-boot.log || true
            exit 1
          fi

      # STORY-P0-01-04, TEST-P0-01-04-A clause 5. Every fixture below existed,
      # compiled and passed, and no CI step ran any of them — nine of the
      # twenty-three. An unrun fixture is an unverified fixture that looks
      # verified, which is LE-07's lesson in a new place, and a host test now
      # fails if the table and this workflow drift apart in either direction.
      - name: TEST-P0-02-02-A — cooperative context switch preserves callee-saved state
        run: cargo run -p xtask -- qemu-x86_64 --fixture=context-switch
      - name: TEST-P0-04-02-A — IDT loads and the local-APIC timer delivers
        run: cargo run -p xtask -- qemu-x86_64 --fixture=idt-apic-timer
      - name: TEST-P0-04-03-A — PCI enumeration over the real ECAM window
        run: cargo run -p xtask -- qemu-x86_64 --fixture=pci-enumeration
      - name: TEST-P0-05-02-A — two real disjoint address spaces are built and validated
        run: cargo run -p xtask -- qemu-x86_64 --fixture=address-space
      - name: TEST-P0-05-03-A — the Win32 shim resolves through a patched IAT
        run: cargo run -p xtask -- qemu-x86_64 --fixture=win32-shim
      - name: TEST-P0-05-04-A — a real PE64 parses and loads
        run: cargo run -p xtask -- qemu-x86_64 --fixture=blue-sharc
      - name: TEST-P0-05-04-A — the same bytes, corrupted, are rejected
        run: cargo run -p xtask -- qemu-x86_64 --fixture=blue-sharc-broken
      - name: TEST-P0-07-01-A — shared-memory IPC between two tasks
        run: cargo run -p xtask -- qemu-x86_64 --fixture=shared-memory

      # Same exit-code hole as broken-boot, closed the same way. This
      # fixture's *correct* outcome is a failure exit code: `int 0x21` reaches
      # the shared fail-closed default, which stops the machine. The default
      # handler now names itself first, so "reached containment" is
      # distinguishable from "died some other way".
      - name: TEST-P0-04-02-A — an unrouted vector reaches the fail-closed default (expect failure)
        run: |
          set +e
          cargo run -p xtask -- qemu-x86_64 --fixture=idt-apic-unrouted --serial-capture=unrouted.log
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected xtask exit code 1 (fail-closed stop) for idt-apic-unrouted, got $code"
            cat unrouted.log || true
            exit 1
          fi
          if ! grep -q 'TOS64-UNROUTED/1 fail_closed=true' unrouted.log; then
            echo "idt-apic-unrouted exited 1 without reaching the fail-closed default handler:"
            cat unrouted.log || true
            exit 1
          fi

      # STORY-P1-01-01: the measurement harness runs in CI from the day it
      # lands, not once a gate needs it. LE-07 (CI unobserved for 30
      # handovers) is the standing lesson here — an unrun fixture is an
      # unverified fixture, and this one has already caught two on-target
      # bugs that host tests could not (see REPORT-2026-07-27-02). `--runs=1`
      # keeps the job cheap: this step proves the fixture boots, measures,
      # and emits a stream xtask can parse, and deliberately asserts nothing
      # about the numbers themselves — Tier 0 run-to-run p99 variance is
      # 39-61%, so thresholding here would be noise. Timing *thresholds*
      # arrive with STORY-P1-01-02's check-timing-regression gate.
      - name: TEST-P1-01-01-A — measurement harness produces a parseable stream (D04/D05/D07)
        run: cargo run -p xtask -- measure --runs=1
      - name: TEST-P1-01-01-A — pool-bench reports through the same harness
        run: cargo run -p xtask -- measure --runs=1 --fixture=pool-bench

      # STORY-P1-02-01: three real CPU exceptions (#UD, #GP, #PF) raised from
      # inside scheduled tasks, each contained to its own task, with the
      # scheduler still dispatching work afterwards. The fixture reports its
      # verdict through isa-debug-exit *and* the UART result line, so this step
      # fails the build if any fault escapes its task — the containment
      # FEAT-P1-03's per-task address spaces will depend on.
      - name: TEST-P1-02-01-A — three real faults, each contained to one task
        run: cargo run -p xtask -- qemu-x86_64 --fixture=fault

      # STORY-P1-02-02: a task destroys its own stack, so the resulting #PF
      # cannot have its frame pushed either and escalates to a real #DF. The
      # fixture passes only if the handler proves it is running on the IST
      # stack — a handler that merely produced output would look identical
      # whether or not the IST did anything. Without the IST this same fixture
      # triple-faults: QEMU resets and never reaches isa-debug-exit, so xtask
      # reports a harness error rather than a kernel verdict, and this step
      # fails either way. That is the point — LE-04 has been open since
      # Handover 32 precisely because a triple fault is silent.
      - name: TEST-P1-02-02-A — a fault inside the fault path lands on the IST stack
        run: cargo run -p xtask -- qemu-x86_64 --fixture=double-fault

      # STORY-P1-03-01: two tasks, each with a genuinely distinct real CR3,
      # switched between via kernel::context::switch_address_space. Task A's
      # own page tables have no entry at all for task B's private address, so
      # its adversarial probe raises a real #PF, contained the same way
      # fixture=fault already proves — and task B keeps running afterward.
      - name: STORY-P1-03-01 — two real address spaces, switched by CR3, isolated by a real fault
        run: cargo run -p xtask -- qemu-x86_64 --fixture=address-space-switch

      # STORY-P1-03-02 Part A. W^X proven adversarially in BOTH directions
      # with the enforcement bits actually on (CR0.WP and EFER.NXE — without
      # them a ring-0 W^X claim is vacuous, which is why enabling them is
      # part of the fixture, not an assumption behind it): a task writes its
      # own RX page, another executes its own RW page, each raising a real
      # #PF contained to itself. The same run retires the boot-time all-RWX
      # identity map for a W^X kernel tree built from the linker's own
      # section symbols, proves the kernel directories are *shared* (one
      # physical PD read back through every tree, not a per-space copy),
      # audits every leaf of both live trees for W+X and for writable
      # aliases of executable frames, and finishes with generation-safe
      # teardown checked by a stale-mapping probe task.
      - name: TEST-P1-03-02-A (A1-A4) — W^X both directions, shared kernel PDs, sealing, teardown
        run: cargo run -p xtask -- qemu-x86_64 --fixture=wx-seal

      # STORY-P1-03-02 Part B — the first real task. The real boot path
      # (ACPI topology + PCI bus 0, same calls and same success gates as
      # kernel_main) then loads the real blue-sharc.exe through the real
      # PE64/TXE pipeline into its own W^X address space and schedules it
      # through the CR3-aware dispatcher. The load-time capability gate
      # refuses its real 205-import surface and journals the refusal; the
      # image is then run anyway under an explicit override policy, and its
      # own CRT's call to an unallowlisted Win32 API through an unpatched
      # IAT faults for real and is contained. Nothing in that fault is
      # staged, which is exactly why this step is worth running: it is the
      # first time this project's containment is exercised by a real
      # workload's own defect rather than by a fixture built to fault.
      - name: TEST-P1-03-02-A (I1-I5) — the first real task, contained and audited
        run: cargo run -p xtask -- qemu-x86_64 --fixture=first-task

      # STORY-P1-03-03. The system image itself: `os` is the first binary in
      # this project's history whose *real* boot path discovers hardware,
      # brings up W^X memory protection, loads a real PE64 through the real
      # loader, resolves its imports against the capability allowlist, and
      # schedules it as a task under its own CR3. Before this, the shipping
      # binary was `kernel`, which could never link `exec` (cyclic crate
      # dependency) and so had never created a task at all. This step fails
      # if the workload's granted `GetCurrentProcess` call does not return
      # the correct pseudo-handle, or if its denied call is not contained.
      - name: TEST-P1-03-03-A — the system image boots, loads and runs a real task
        run: cargo run -p xtask -- qemu-x86_64 --fixture=os

      # STORY-P1-04-03, closing LE-20. For two Features this project had a
      # Verified preemptive scheduler and a Verified WCET watchdog, and the
      # binary it ships ran neither: `os` installed no tick hook. This step
      # boots the *same* `os` binary with one thing changed — the four pages
      # `include_bytes!` embeds are a real PE64 whose `.text` is `EB FE`,
      # `jmp $`. It imports the same two names, is admitted by the same
      # capability gate, and is mapped by the same loader; it simply never
      # calls, never faults and never yields.
      #
      # The hook, the dispatch loop, the declared overrun policy and the
      # address-space handling are the same compiled code as the step above,
      # which is what makes this evidence about the shipping binary rather
      # than about a fixture. With `set_tick_hook` removed and nothing else
      # changed, this step does not fail an assertion — it times out at 15s,
      # because the shipping image has no way to take the CPU back.
      - name: TEST-P1-04-03-A — the shipping image enforces its budget on a workload that never yields
        run: |
          set +e
          cargo run -p xtask -- qemu-x86_64 --fixture=os-runaway --serial-capture=os-runaway.log
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "the shipping image failed to contain a runaway workload (exit $code):"
            cat os-runaway.log
            exit 1
          fi
          # The exit code alone is not the assertion. `wcet-trip` established
          # why (REPORT-2026-07-28-04): a run that succeeds for some other
          # reason is indistinguishable from one that enforced. These are the
          # two consequences the reporting path cannot produce on its own —
          # the priority read back out of the scheduler, and the tick hook
          # having been installed at all.
          if ! grep -q 'priority_after_enforce=Some(0)' os-runaway.log; then
            echo "the workload's declared degrade was not applied by the kernel:"
            cat os-runaway.log
            exit 1
          fi
          if ! grep -q 'hook_installed=true' os-runaway.log; then
            echo "the shipping image installed no tick hook:"
            cat os-runaway.log
            exit 1
          fi

      # STORY-P1-03-03: FEAT-P1-03's last exit criterion. Two dispatch
      # rounds through the production CR3-aware dispatcher differing only in
      # whether the selected task's address space is already loaded, so the
      # difference between them is what isolation costs per scheduling
      # decision. Reported, deliberately not gated: at Tier 0 the cross-space
      # figure is dominated by TCG's own TLB-flush emulation rather than by
      # the instruction, so thresholding it would gate the emulator.
      - name: TEST-P1-03-03-A — D04 same-space vs cross-space dispatch cost
        run: cargo run -p xtask -- measure --runs=1 --fixture=dispatch

      # STORY-P0-01-06: the D09 work unit — PE64 parsing and import validation
      # against the real blue-sharc.txe, accept path and denial path.
      # Reported, deliberately not gated, and outside the gated `measure`
      # envelope on purpose: adding D09 there would force a same-commit
      # baseline re-record, which on a dev host bakes in the confirmed
      # cross-host offset (LE-23/LE-28). The denial path is what closed
      # PERF-D09-G20; the accept path is 17.6-39.1x over its stated budget and
      # is registered as LE-42 rather than gated on a number nobody trusts yet.
      - name: TEST-P0-01-06-A — D09 PE64 parse and import validation
        run: cargo run -p xtask -- measure --runs=1 --fixture=pe-measure

      # STORY-P1-04-01: the first genuinely preemptive dispatch this kernel
      # has performed. A low-priority task whose body contains no switch, no
      # hlt and no scheduler call is taken off the CPU by a real local-APIC
      # tick in favour of a task the tick hook itself made Ready, and — the
      # adversarial half, LE-14 — the SSE register it was using survives a
      # preemption in which the preempting task deliberately writes a
      # different value into it. That second check is not decoration: it is
      # what caught the extended-state save being in the wrong place (around
      # the context switch rather than around the whole ISR), which every
      # non-preempting tick would otherwise have walked straight through.
      - name: TEST-P1-04-01-A — a task that never yields is preempted, with its SSE state intact
        run: cargo run -p xtask -- qemu-x86_64 --fixture=preempt

      # STORY-P1-04-01, closing STORY-P0-02-03's own host-only caveat: the
      # classic three-task inversion scenario under genuine preemption. Low
      # holds the lock, high preempts and blocks on it, medium spins at a
      # priority between them. The build fails unless the dispatch order is
      # low -> high -> low -> high *and* medium's counter is frozen across
      # that window while medium is demonstrably Ready throughout — both,
      # because either alone can be satisfied for the wrong reason.
      - name: TEST-P1-04-01-A — priority inversion avoided under real preemption
        run: cargo run -p xtask -- qemu-x86_64 --fixture=priority-inversion

      # STORY-P1-04-02: the timer now enforces WCET budgets, not just measures
      # them. One step per declared policy arm, all three driving the same
      # enforcement path in kernel::wcet — the offending task's declaration is
      # the only thing that differs between them.
      #
      # The restart step's real content is not "the task ran again": it is
      # that enforcements are spaced a full budget apart, which is the only
      # observable consequence of the kernel having reset the budget window.
      # Without that assertion the fixture passed with every scheduler
      # mutation removed, because the fixture's own context rewind reproduced
      # the visible half. See REPORT-2026-07-28-04.
      - name: TEST-P1-04-02-A — WCET overrun restarts the task from its entry point
        run: cargo run -p xtask -- qemu-x86_64 --fixture=wcet-restart

      # The degrade step fails unless a competitor at a priority *between* the
      # offender's original and its declared floor makes no progress at all
      # before the degrade and starts winning selections after it. Without
      # that competitor, "degrade" is indistinguishable from "reset the budget
      # and carry on".
      - name: TEST-P1-04-02-A — WCET overrun degrades the task below a real competitor
        run: cargo run -p xtask -- qemu-x86_64 --fixture=wcet-degrade

      # This fixture's *correct* outcome is a failure exit code: the system
      # enters its declared safe state, which at Tier 0 is a fail-closed stop.
      #
      # Exit 1 alone is NOT sufficient evidence here, and that is the
      # difference between this step and the broken-boot one above. A fixture
      # that failed for any other reason also exits 1, so the exit code cannot
      # distinguish "tripped correctly" from "broke". A deliberate
      # falsification confirmed it: with enforcement removed, this fixture
      # still exited 1. The serial capture is therefore part of the assertion.
      - name: TEST-P1-04-02-A — WCET overrun trips the system to its safe state (expect failure)
        run: |
          set +e
          cargo run -p xtask -- qemu-x86_64 --fixture=wcet-trip --serial-capture=wcet-trip.log
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected xtask exit code 1 (fail-closed stop) for the wcet-trip fixture, got $code"
            exit 1
          fi
          if ! grep -q 'task_finished=true' wcet-trip.log; then
            echo "the offending task was not actually Finished by the kernel:"
            cat wcet-trip.log
            exit 1
          fi
          if ! grep -q 'TOS64-RESULT/1 fixture=wcet-trip ok=true' wcet-trip.log; then
            echo "wcet-trip exited 1 but did not report a correct trip:"
            cat wcet-trip.log
            exit 1
          fi

      # STORY-P1-04-05, closing LE-50: the composed scenario under real
      # preemption. STORY-P1-04-04 proved at the host level that a WCET
      # degrade and a priority-inheritance boost compose; this proves it by
      # who the dispatcher actually selected. A medium task at priority 15 —
      # Ready throughout, and demonstrably able to run afterwards — makes no
      # progress at all across a window that contains the degrade of a holder
      # boosted to 25, and the holder then lands on its declared floor of 2
      # rather than the 5 it left. Under the pre-STORY-P1-04-04 kernel the
      # degrade discarded the boost and medium would have started winning
      # selections immediately, so the frozen counter is a claim the old
      # kernel could not have satisfied.
      #
      # Run under serial capture, and the capture is retained on failure.
      # LE-46 is the reason: the soak's own priority-inversion FAIL had no
      # diagnostic for the one run that mattered, which left it impossible to
      # adjudicate either way. A fixture armed to detect and not to explain is
      # half an instrument.
      - name: TEST-P1-04-05-A — a degrade taken while boosted keeps the boost, then lands on its floor
        run: |
          set +e
          cargo run -p xtask -- qemu-x86_64 --fixture=degrade-inheritance --serial-capture=degrade-inheritance.log
          code=$?
          set -e
          if [ "$code" -ne 0 ] || ! grep -q 'TOS64-RESULT/1 fixture=degrade-inheritance ok=true' degrade-inheritance.log; then
            echo "the composed degrade/inheritance fixture did not pass (exit $code):"
            cat degrade-inheritance.log
            exit 1
          fi

      # STORY-P1-06-01 — G-PA-1's flagship path, FEAT-P1-06's mechanism half.
      # One RT task arms an activation, computes a command and drives a real
      # output boundary (an ISA port write standing in for an actuator line),
      # with the decision-to-actuation latency measured and reported as a
      # TOS64-MEAS/2 envelope. The same run then attacks the port with the
      # background task's real TaskId, placed in Running so that the ONLY
      # thing distinguishing it from the declared owner is its identity, and
      # asserts the line is never written.
      #
      # These numbers close no guardrail. Under ADR 0005 a worst-case bound is
      # quotable only from a platform holding a secure-world qualification
      # record and zero platforms hold one, so PERF-D03-G04/PERF-D05-G04 stay
      # open as stated debt against LE-09. This step gates the mechanism, not
      # a threshold.
      - name: TEST-P1-06-01-A — decision to actuation, measured, with no ambient path to the output
        run: |
          set +e
          cargo run -p xtask -- qemu-x86_64 --fixture=actuation --serial-capture=actuation.log
          code=$?
          set -e
          if [ "$code" -ne 0 ] || ! grep -q 'TOS64-RESULT/1 fixture=actuation ok=true' actuation.log; then
            echo "the actuation fixture did not pass (exit $code):"
            cat actuation.log
            exit 1
          fi

      # The positive control, and it is not optional: FEAT-P1-06's own exit
      # criterion says "the proof must show the enforcement firing, not only
      # clean runs" — written two days before ADR 0005 said the same thing
      # about Q3 campaigns. A clean run does not stand in for a demonstrated
      # trip.
      #
      # A deliberately-overrunning decision misses its declared deadline, has
      # its late command REFUSED while it is still running, and is then
      # removed by the WCET enforcement it declared. No command reaches the
      # line. Exit 1 is the CORRECT outcome — the system enters its declared
      # safe state — so this step inverts the code, and the RESULT line is
      # what distinguishes a correct trip from a broken one, because the exit
      # code cannot. Same treatment wcet-trip already gets.
      - name: TEST-P1-06-01-A — a deliberate overrun trips the policy before any late command is emitted
        run: |
          set +e
          cargo run -p xtask -- qemu-x86_64 --fixture=actuation-overrun --serial-capture=actuation-overrun.log
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "actuation-overrun exited 0: the system did NOT enter its safe state"
            cat actuation-overrun.log
            exit 1
          fi
          if ! grep -q 'TOS64-RESULT/1 fixture=actuation-overrun ok=true' actuation-overrun.log; then
            echo "actuation-overrun exited non-zero but did not report a correct trip:"
            cat actuation-overrun.log
            exit 1
          fi

      # TEST-P2-07-01-A: the owner's MS-DOS parity harness — a .TCB batch runs
      # through TINYCMD's DOS front-end against the labelled RAM volume on the
      # real target, and the serial transcript must byte-match the committed
      # golden (two signals: in-guest assertions gate isa-debug-exit, the
      # transcript gates here; either alone is not a pass). The plain fixture
      # boot below keeps the fixture-coverage test honest about what CI runs.
      - name: TEST-P2-07-01-A — the parity .TCB boots and its in-guest assertions hold
        run: cargo run -p xtask -- qemu-x86_64 --fixture=shell-batch
      - name: TEST-P2-07-01-A — TINYCMD transcript parity vs the committed golden
        run: cargo run -p xtask -- check-shell-parity

      # STORY-P1-01-02's gate, re-based onto same-run ratios by
      # STORY-P1-01-04. Unlike the two steps above, this one *does* assert
      # about the numbers — but only the stable statistics (min, p50), only
      # over the median of three release-profile runs, and only on each
      # metric's ratio to a fixed reference workload measured in the same run.
      #
      # The ratio is the point. This step was red on main for five sessions
      # while gating absolute cycle counts: between two runs of identical
      # binaries (one commit changed a single markdown file) every metric
      # moved together by 1.8-2.2x and the tightest one reported REGRESSED
      # about code that had not changed. The runner's speed cancels out of a
      # same-run ratio; a real regression does not. See
      # os/src/xtask/src/gate.rs for the derivation, the four-quadrant
      # demonstration, and what a 2x-or-worse sensitivity can and cannot
      # catch.
      #
      # If this step ever fails, read the reference metric's own cycle count
      # in the output first — it is the direct measure of how fast this
      # runner was, and it is printed before any verdict for that reason.
      #
      # A missing or malformed baseline fails this step rather than skipping
      # it. Exit 1 is a regression, exit 2 a harness error; either fails the
      # build, exactly as a functional test failure does (README Phase 1).
      - name: TEST-P1-01-04-A — timing-regression gate (same-run ratios vs committed baselines)
        run: cargo run -p xtask -- check-timing-regression --runs=3
  # LE-23 -- the baseline recorder, and it is deliberately manual.
  #
  # `goals/performance/baselines/tier0-x86_64.tsv` was recorded on a Windows dev
  # host, and two CI runs (30294647525, 30294872213) confirmed it reads
  # systematically high on this runner: D04, D05/dispatch_run_once and D02 all
  # came in 23-53% BELOW baseline in both runs, consistently signed, with two of
  # them reporting improved-is-the-baseline-stale -- the gate correctly
  # reporting a baseline recorded on the wrong host. A same-run ratio cancels
  # out how *fast* a runner is; it cannot cancel out a different machine's
  # relative costs, and that is precisely what LE-23 is.
  #
  # `workflow_dispatch` rather than `push`, and that is the whole design.
  # Re-recording on every push would mean the gate always compares against the
  # run that just happened, which is not a gate at all -- it is a very
  # expensive way of asserting that a number equals itself. Recording is an act
  # somebody decides to take, and the artifact it produces is reviewed and
  # committed by hand rather than written back into the repository by CI.
  #
  # LE-28 is the local counterpart of the same rule: do NOT run
  # `--update-baseline` on a dev host. That is what produced the offset this
  # job exists to remove.
  record-timing-baseline:
    name: LE-23 -- record the Tier 0 baseline on this runner (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --profile minimal --component rust-src "$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)"

      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86

      # The same `--runs=3` median the gate itself compares against, in the same
      # release profile -- LE-13: a dev-profile number is not a noisier version
      # of the same thing, it is a different binary. The date is passed
      # explicitly because the recorded date is committed data, not a wall clock
      # the tool reads for itself.
      - name: Record the baseline
        run: |
          cargo run -p xtask -- check-timing-regression --runs=3 \
            --update-baseline --date="$(date -u +%Y-%m-%d)"

      # Printed as well as uploaded, so the numbers are readable in the log
      # without downloading anything -- the first thing a reviewer wants is the
      # reference metric's own cycle count, which says how fast this runner was.
      - name: Show what was recorded
        run: cat ../goals/performance/baselines/tier0-x86_64.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: tier0-x86_64-baseline
          path: goals/performance/baselines/tier0-x86_64.tsv
          if-no-files-found: error
