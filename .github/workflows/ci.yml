name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: os

jobs:
  governance-gates:
    name: Format, lint, size, assurance, missing_docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: |
          rustup toolchain install --profile minimal --component rustfmt --component clippy --component rust-src "$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)"

      - name: rustfmt check
        run: cargo fmt --all -- --check

      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: crate-size ceiling (20,000 LOC excluding tests)
        run: cargo run -p xtask -- check-crate-sizes --ceiling=20000

      - name: Performance catalogue integrity (625 tests)
        run: cargo run -p xtask -- check-performance-catalogue

      - name: Assurance spine coverage (Stories, performance, security)
        run: cargo run -p xtask -- check-assurance-spine

      - name: missing_docs check
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D missing-docs"

  governance-fixture-smoke-test:
    name: TEST-P0-01-02-A — fixtures actually catch what they claim to
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain
        run: |
          rustup toolchain install --profile minimal --component rustfmt --component clippy "$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)"
      - name: Run fixture smoke test
        run: cargo run -p xtask -- governance-fixture-test

  kernel-boot-x86_64:
    name: TEST-P0-01-01-A / TEST-P0-01-03-A — kernel boots to halt under QEMU
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned nightly toolchain + rust-src
        run: |
          rustup toolchain install --profile minimal --component rust-src "$(grep -oP 'channel\s*=\s*"\K[^"]+' rust-toolchain.toml)"
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Boot kernel (expect success)
        run: cargo run -p xtask -- qemu-x86_64
      - name: Boot deliberately-broken fixture (expect distinguishable failure code)
        run: |
          set +e
          cargo run -p xtask -- qemu-x86_64 --fixture=broken-boot
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected xtask exit code 1 (KernelBootFailed) for the broken-boot fixture, got $code"
            exit 1
          fi

      # STORY-P1-01-01: the measurement harness runs in CI from the day it
      # lands, not once a gate needs it. LE-07 (CI unobserved for 30
      # handovers) is the standing lesson here — an unrun fixture is an
      # unverified fixture, and this one has already caught two on-target
      # bugs that host tests could not (see REPORT-2026-07-27-02). `--runs=1`
      # keeps the job cheap: this step proves the fixture boots, measures,
      # and emits a stream xtask can parse, and deliberately asserts nothing
      # about the numbers themselves — Tier 0 run-to-run p99 variance is
      # 39-61%, so thresholding here would be noise. Timing *thresholds*
      # arrive with STORY-P1-01-02's check-timing-regression gate.
      - name: TEST-P1-01-01-A — measurement harness produces a parseable stream (D04/D05/D07)
        run: cargo run -p xtask -- measure --runs=1
      - name: TEST-P1-01-01-A — pool-bench reports through the same harness
        run: cargo run -p xtask -- measure --runs=1 --fixture=pool-bench

      # STORY-P1-02-01: three real CPU exceptions (#UD, #GP, #PF) raised from
      # inside scheduled tasks, each contained to its own task, with the
      # scheduler still dispatching work afterwards. The fixture reports its
      # verdict through isa-debug-exit *and* the UART result line, so this step
      # fails the build if any fault escapes its task — the containment
      # FEAT-P1-03's per-task address spaces will depend on.
      - name: TEST-P1-02-01-A — three real faults, each contained to one task
        run: cargo run -p xtask -- qemu-x86_64 --fixture=fault

      # STORY-P1-02-02: a task destroys its own stack, so the resulting #PF
      # cannot have its frame pushed either and escalates to a real #DF. The
      # fixture passes only if the handler proves it is running on the IST
      # stack — a handler that merely produced output would look identical
      # whether or not the IST did anything. Without the IST this same fixture
      # triple-faults: QEMU resets and never reaches isa-debug-exit, so xtask
      # reports a harness error rather than a kernel verdict, and this step
      # fails either way. That is the point — LE-04 has been open since
      # Handover 32 precisely because a triple fault is silent.
      - name: TEST-P1-02-02-A — a fault inside the fault path lands on the IST stack
        run: cargo run -p xtask -- qemu-x86_64 --fixture=double-fault

      # STORY-P1-01-02's gate. Unlike the two steps above, this one *does*
      # assert about the numbers — but only the stable statistics (min, p50),
      # only over the median of three release-profile runs, and only against a
      # tolerance derived from measured Tier 0 noise (60% + a 24-cycle floor;
      # see os/src/xtask/src/gate.rs for the derivation and for what that
      # loose a tolerance can and cannot catch). A missing or malformed
      # baseline fails this step rather than skipping it. Exit 1 is a
      # regression, exit 2 a harness error; either fails the build, exactly as
      # a functional test failure does (README Phase 1).
      - name: TEST-P1-01-02-A — timing-regression gate (D04/D05/D07 vs committed baselines)
        run: cargo run -p xtask -- check-timing-regression --runs=3
